                            for (let i = 0; i < n; i++) {
                                const ang = spec.kind === 'thread' ? Math.random() * Math.PI * 2 : -Math.PI * Math.random() * 1.2;
                                const spd = 2 + Math.random() * (5 + tier);
                                const col = i % 3 === 0 ? '#FFFBEB' : (Math.random() > 0.35 ? '#FFD700' : '#FF5E00');
                                sparks.push(new Spark(jx, jy, Math.cos(ang) * spd, Math.sin(ang) * spd - 1, col, 1.8 + Math.random() * 1.2, 0.05 + Math.random() * 0.03, 0.22, 0.95));
                            }
                            const papers = spec.kind === 'thread' ? 1 : 2;
                            for (let q = 0; q < papers; q++) {
                                const ang = -Math.PI * (0.1 + Math.random() * 0.8);
                                const spd = 2 + Math.random() * 5;
                                sparks.push(new Spark(jx, jy, Math.cos(ang) * spd, Math.sin(ang) * spd, Math.random() > 0.25 ? '#DC2626' : '#FACC15', 2.2 + Math.random() * 1.2, 0.028, 0.24, 0.94, { isPaper: true }));
                            }
                            if (Math.random() < 0.1) {
                                shockwaves.push(new Shockwave(jx, jy, 24 + tier * 10, Math.random() > 0.4 ? '#FFD700' : '#FF5E00'));
                            }
                        }
                        if (tier >= 3 && Math.random() < 0.025) this.triggerScreenShake();

                        if (this.activeTimer <= 0) {
                            // Heavy head cracker at the end of the string
                            setTimeout(() => audio.playLadFinale(tier), 90);
                            screenFlashColor = '255, 195, 70';
                            screenFlash = Math.min(0.85, screenFlash + 0.5);
                            if (tier >= 2) this.triggerScreenShake();
                            shockwaves.push(new Shockwave(bx, by, 120 + tier * 28, '#FFD700'));
                            for (let i = 0; i < 40 + tier * 12; i++) {
                                const ang = Math.random() * Math.PI * 2;
                                const spd = 2 + Math.random() * (8 + tier * 2);
                                sparks.push(new Spark(bx, by, Math.cos(ang) * spd, Math.sin(ang) * spd - 1.5, i % 3 ? '#FFD700' : '#FFFBEB', 2.2, 0.03, 0.2, 0.96, { crackle: i % 6 === 0 }));
                            }
                            this.state = 'done';
                        }

                    } else if (this.isMultiShot()) {
                        if (this.shotsRemaining > 0) {
                            this.shotCooldown--;
                            if (this.shotCooldown <= 0) {
                                this.fireShotVolley();
                                this.shotCooldown = this.shotInterval + Math.floor((Math.random() - 0.5) * 4);
                            }
                        } else {
                            this.finishTimer--;
                            if (this.finishTimer <= 0) this.state = 'done';
                        }
                    }
                }
            }

            draw(ctx) {
                if (this.state === 'done') return;

                ctx.save();

                // 1. Draw Mitti Diya
                if (this.type === 'diya') {
                    // Ambient floor glow when lit
                    if (this.state === 'active') {
                        const glowRadius = 115 + Math.sin(this.flameFlicker) * 8;
                        const grad = ctx.createRadialGradient(this.x + 18, this.y - 14, 2, this.x, this.y, glowRadius);
                        grad.addColorStop(0, 'rgba(255, 200, 50, 0.48)');
                        grad.addColorStop(0.45, 'rgba(255, 110, 0, 0.16)');
                        grad.addColorStop(1, 'rgba(255, 80, 0, 0)');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(this.x + 10, this.y - 6, glowRadius, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Cotton Wick
                    ctx.strokeStyle = this.state === 'unlit' ? '#FDE68A' : '#78350F';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(this.x + 12, this.y - 2);
                    ctx.quadraticCurveTo(this.x + 17, this.y - 6, this.x + 19, this.y - 9);
                    ctx.stroke();

                    // Terracotta Clay Bowl
                    ctx.fillStyle = '#9E3B18';
                    ctx.strokeStyle = '#F59E0B';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(this.x - 22, this.y - 3);
                    ctx.quadraticCurveTo(this.x, this.y + 18, this.x + 24, this.y - 3);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    // Decorative Gold Rim
                    ctx.strokeStyle = '#FFD700';
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.ellipse(this.x + 1, this.y - 3, 23, 4.5, 0, 0, Math.PI * 2);
                    ctx.fillStyle = '#5C1D0A';
                    ctx.fill();
                    ctx.stroke();

                    // Living Flame
                    if (this.state === 'active') {
                        const sway = Math.sin(this.flameFlicker) * 2.2;
                        const stretch = Math.cos(this.flameFlicker * 1.3) * 2;

                        // Outer Saffron Flame
                        ctx.fillStyle = '#FF7B00';
                        ctx.beginPath();
                        ctx.moveTo(this.x + 18, this.y - 7);
                        ctx.quadraticCurveTo(this.x + 27, this.y - 16, this.x + 18 + sway, this.y - 30 - stretch);
                        ctx.quadraticCurveTo(this.x + 9, this.y - 16, this.x + 18, this.y - 7);
                        ctx.fill();

                        // Inner White-Gold Core
                        ctx.fillStyle = '#FFFBEB';
                        ctx.beginPath();
                        ctx.moveTo(this.x + 18, this.y - 8);
                        ctx.quadraticCurveTo(this.x + 23, this.y - 14, this.x + 18 + sway * 0.5, this.y - 22 - stretch * 0.5);
                        ctx.quadraticCurveTo(this.x + 13, this.y - 14, this.x + 18, this.y - 8);
                        ctx.fill();
                    }
                }

                // 2. Draw Chakri (Ground Spinner)
                else if (this.type === 'chakri') {
                    // Fuse cord
                    if (this.state !== 'active') {
                        const tip = this.getFuseTip();
                        ctx.strokeStyle = '#FDE047';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(this.x + 16, this.y);
                        ctx.lineTo(tip.x, tip.y);
                        ctx.stroke();
                    }

                    ctx.translate(this.x, this.y);
                    ctx.scale(1, 0.58); // Isometric floor perspective
                    ctx.rotate(this.spinAngle);

                    // Outer Red Coil
                    ctx.fillStyle = '#B91C1C';
                    ctx.strokeStyle = '#FBBF24';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, 18, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    // Inner Foil Pattern
                    ctx.fillStyle = '#1D4ED8';
                    ctx.beginPath();
                    ctx.arc(0, 0, 11, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(0, 0, 4.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 3. Draw Anaar (Conical Flower Pot)
                else if (this.type === 'anaar') {
                    // Fuse cord
                    if (this.state !== 'active') {
                        const tip = this.getFuseTip();
                        ctx.strokeStyle = '#FDE047';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(this.x, this.y - 40);
                        ctx.lineTo(tip.x, tip.y);
                        ctx.stroke();
                    }

                    // Active Fountain Base Glow
                    if (this.state === 'active') {
                        const g = ctx.createRadialGradient(this.x, this.y - 40, 2, this.x, this.y - 25, 130);
                        g.addColorStop(0, 'rgba(255, 235, 150, 0.65)');
                        g.addColorStop(0.5, 'rgba(255, 120, 0, 0.22)');
                        g.addColorStop(1, 'rgba(0, 0, 0, 0)');
                        ctx.fillStyle = g;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y - 25, 130, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Conical Body
                    ctx.fillStyle = '#991B1B';
                    ctx.strokeStyle = '#FBBF24';
                    ctx.lineWidth = 1.6;
                    ctx.beginPath();
                    ctx.moveTo(this.x - 5, this.y - 40);
                    ctx.lineTo(this.x + 5, this.y - 40);
                    ctx.lineTo(this.x + 18, this.y);
                    ctx.lineTo(this.x - 18, this.y);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    // Traditional Gold Foil Band
                    ctx.fillStyle = '#F59E0B';
                    ctx.beginPath();
                    ctx.moveTo(this.x - 10, this.y - 24);
                    ctx.lineTo(this.x + 10, this.y - 24);
                    ctx.lineTo(this.x + 14, this.y - 11);
                    ctx.lineTo(this.x - 14, this.y - 11);
                    ctx.closePath();
                    ctx.fill();
                }

                // 4. Draw Sutli Bomb (Green Twine Cracker)
                else if (this.type === 'sutli') {
                    const tip = this.getFuseTip();
                    ctx.strokeStyle = '#FDE047';
                    ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y - 24);
                    ctx.quadraticCurveTo(this.x + 4, this.y - 34, tip.x, tip.y);
                    ctx.stroke();

                    // Green Jute Twine Body
                    ctx.fillStyle = '#15803D';
                    ctx.strokeStyle = '#86EFAC';
                    ctx.lineWidth = 1.4;
                    ctx.beginPath();
                    ctx.roundRect(this.x - 14, this.y - 24, 28, 26, 4);
                    ctx.fill();
                    ctx.stroke();

                    // Red & Gold Thread Wrappings
                    ctx.strokeStyle = '#DC2626';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(this.x - 14, this.y - 16);
                    ctx.lineTo(this.x + 14, this.y - 16);
                    ctx.moveTo(this.x - 14, this.y - 6);
                    ctx.lineTo(this.x + 14, this.y - 6);
                    ctx.stroke();

                    ctx.strokeStyle = '#FACC15';
                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    ctx.moveTo(this.x - 14, this.y - 11);
                    ctx.lineTo(this.x + 14, this.y - 11);
                    ctx.stroke();
                }

                // 5. Draw Akash Rocket (Bottle Rocket)
                else if (this.type === 'rocket') {
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.tiltAngle * 0.5);

                    // Bamboo Guide Stick
                    ctx.strokeStyle = '#A16207';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(3, -15);
                    ctx.lineTo(3, 28);
                    ctx.stroke();

                    // Fuse
                    if (this.state !== 'active') {
                        ctx.strokeStyle = '#FDE047';
                        ctx.lineWidth = 1.8;
                        ctx.beginPath();
                        ctx.moveTo(-2, 6);
                        ctx.lineTo(-10 * (1 - this.fuseProgress), 8 + (1 - this.fuseProgress) * 14);
                        ctx.stroke();
                    }

                    // Rocket Red Cylinder
                    ctx.fillStyle = '#DC2626';
                    ctx.strokeStyle = '#FDE047';
                    ctx.lineWidth = 1.2;
                    ctx.fillRect(-6, -16, 12, 22);
                    ctx.strokeRect(-6, -16, 12, 22);

                    // Golden Nose Cone
                    ctx.fillStyle = '#FACC15';
                    ctx.beginPath();
                    ctx.moveTo(0, -30);
                    ctx.lineTo(-8, -16);
                    ctx.lineTo(8, -16);
                    ctx.closePath();
                    ctx.fill();
                }

                // 6. Draw Lads: 100 / 1000 = straight hanging thread, 5000 / 10000 = coiled roll
                else if (this.isWala()) {
                    const spec = WALA_SPECS[this.type];
                    const active = this.state === 'active';
                    const prog = active ? Math.min(1, 1 - this.activeTimer / this.maxTimer) : 0;
                    const tier = spec.tier;

                    if (spec.kind === 'thread') {
                        const len = this.threadLen;
                        const topY = this.y - len;
                        const headY = this.y - prog * len;

                        // Hanging peg
                        ctx.fillStyle = '#FFD700';
                        ctx.beginPath();
                        ctx.arc(this.x, topY - 4, 3.2, 0, Math.PI * 2);
                        ctx.fill();

                        if (!active) {
                            const tip = this.getFuseTip();
                            ctx.strokeStyle = '#FDE047';
                            ctx.lineWidth = 2;
                            ctx.beginPath();
                            ctx.moveTo(this.x, this.y);
                            ctx.lineTo(tip.x, tip.y);
                            ctx.stroke();
                        }

                        // Straight twine
                        ctx.strokeStyle = '#F59E0B';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(this.x, topY);
                        ctx.lineTo(this.x, headY);
                        ctx.stroke();

                        // Crackers in pairs along the thread
                        const gap = len / spec.pairs;
                        ctx.fillStyle = '#DC2626';
                        for (let i = 0; i < spec.pairs; i++) {
                            const py = topY + 4 + i * gap;
                            if (py > headY) break;
                            const jit = active && Math.abs(py - headY) < 12 ? (Math.random() - 0.5) * 2.5 : 0;
                            ctx.fillRect(this.x - spec.cw - 1 + jit, py - spec.ch / 2, spec.cw, spec.ch);
                            ctx.fillRect(this.x + 1 + jit, py - spec.ch / 2, spec.cw, spec.ch);
                        }
                        if (this.type === 'wala1000') {
                            ctx.fillStyle = '#FEF08A';
                            ctx.font = 'bold 8px sans-serif';
                            ctx.textAlign = 'center';
                            if (!active) ctx.fillText('1K', this.x, topY - 10);
                        }

                        if (active) {
                            const fr = 18 + tier * 7;
                            const fg = ctx.createRadialGradient(this.x, headY, 1, this.x, headY, fr);
                            fg.addColorStop(0, 'rgba(255, 255, 230, 0.95)');
                            fg.addColorStop(0.45, 'rgba(255, 165, 0, 0.6)');
                            fg.addColorStop(1, 'rgba(255, 50, 0, 0)');
                            ctx.fillStyle = fg;
                            ctx.beginPath();
                            ctx.arc(this.x, headY, fr, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    } else {
                        const R = spec.r;
                        const r0 = R * 0.2;
                        const Th = spec.turns * Math.PI * 2;
                        const thB = prog * Th;
                        const rAt = th => R - (R - r0) * (th / Th);

                        if (!active) {
                            const tip = this.getFuseTip();
                            ctx.strokeStyle = '#FDE047';
                            ctx.lineWidth = 2.2;
                            ctx.beginPath();
                            ctx.moveTo(this.x + R, this.y);
                            ctx.lineTo(tip.x, tip.y);
                            ctx.stroke();
                        }

                        ctx.save();
                        ctx.translate(this.x + (active ? (Math.random() - 0.5) * 1.2 : 0), this.y);
                        ctx.scale(1, 0.58);

                        ctx.fillStyle = 'rgba(30, 6, 4, 0.55)';
                        ctx.beginPath();
                        ctx.arc(0, 0, R + 4, 0, Math.PI * 2);
                        ctx.fill();

                        const spiral = () => {
                            ctx.beginPath();
                            for (let th = thB; th <= Th; th += 0.1) {
                                const rr = rAt(th);
                                const px = Math.cos(th) * rr, py = Math.sin(th) * rr;
                                if (th === thB) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                            }
                            ctx.stroke();
                        };
                        ctx.lineCap = 'butt';
                        ctx.strokeStyle = '#B45309';
                        ctx.lineWidth = spec.cw + 1.5;
                        spiral();
                        ctx.strokeStyle = '#DC2626';
                        ctx.lineWidth = spec.cw;
                        ctx.setLineDash([5, 2.2]);
                        spiral();
                        ctx.setLineDash([]);

                        ctx.fillStyle = '#7F1D1D';
                        ctx.strokeStyle = '#FFD700';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.arc(0, 0, r0 * 0.95, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        ctx.restore();

                        ctx.fillStyle = '#FEF08A';
                        ctx.font = 'bold 9px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText(this.type === 'wala5000' ? '5K' : '10K', this.x, this.y + 3);

                        if (active) {
                            const hx = this.x + Math.cos(thB) * rAt(thB);
                            const hy = this.y + Math.sin(thB) * rAt(thB) * 0.58;
                            const fr = 24 + tier * 6;
                            const fg = ctx.createRadialGradient(hx, hy, 2, hx, hy, fr);
                            fg.addColorStop(0, 'rgba(255, 255, 240, 0.98)');
                            fg.addColorStop(0.4, 'rgba(255, 180, 20, 0.7)');
                            fg.addColorStop(1, 'rgba(255, 60, 0, 0)');
                            ctx.fillStyle = fg;
                            ctx.beginPath();
                            ctx.arc(hx, hy, fr, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }

                // 8. Draw 12 / 30 / 60 Multi-Shot Sky Battery Boxes
                else if (this.isMultiShot()) {
                    const halfW = this.type === 'shot12' ? 18 : (this.type === 'shot30' ? 26 : 34);
                    const boxH = 24;

                    if (this.state !== 'active') {
                        const tip = this.getFuseTip();
                        ctx.strokeStyle = '#FDE047';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(this.x - halfW, this.y - boxH + 4);
                        ctx.lineTo(tip.x, tip.y);
                        ctx.stroke();
                    }

                    // Battery Outer Box
                    ctx.fillStyle = this.type === 'shot60' ? '#581C87' : (this.type === 'shot30' ? '#991B1B' : '#7C2D12');
                    ctx.strokeStyle = '#FFD700';
                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    ctx.roundRect(this.x - halfW, this.y - boxH, halfW * 2, boxH, 3);
                    ctx.fill();
                    ctx.stroke();

                    // Gold Tube Dividers & Shot Count Label
                    ctx.fillStyle = '#FEF08A';
                    ctx.font = 'bold 7.5px sans-serif';
                    ctx.textAlign = 'center';
                    const label = this.type === 'shot12' ? '12 SHOT' : (this.type === 'shot30' ? '30 SHOT' : '60 SHOT');
                    ctx.fillText(label, this.x, this.y - 9);

                    if (this.muzzleGlow > 0.03) {
                        const mg = ctx.createRadialGradient(this.x, this.y - boxH, 2, this.x, this.y - boxH, 70);
                        mg.addColorStop(0, `rgba(255, 230, 150, ${0.7 * this.muzzleGlow})`);
                        mg.addColorStop(0.5, `rgba(255, 130, 20, ${0.25 * this.muzzleGlow})`);
                        mg.addColorStop(1, 'rgba(255, 80, 0, 0)');
                        ctx.fillStyle = mg;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y - boxH, 70, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // Subtle unlit wick indicator ring
                if (this.state === 'unlit') {
                    const tip = this.getFuseTip();
                    const pulse = 3.5 + Math.sin(this.flameFlicker * 0.8) * 1.5;
                    ctx.strokeStyle = 'rgba(255, 215, 0, 0.65)';
                    ctx.lineWidth = 1.4;
                    ctx.beginPath();
                    ctx.arc(tip.x, tip.y, pulse, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        /**
         * ============================================================================
         * 5. INITIAL FESTIVE COURTYARD SCENE (Responsive Across Mobile, Tablet & PC)
         * ============================================================================
         */
        function populateDefaultCourtyard() {
            resizeCanvas();
            items.length = 0;
            aerialShells.length = 0;
            sparks.length = 0;
            shockwaves.length = 0;
            layoutDirty = false;
            if (audio.stopTrains) audio.stopTrains();

            // Usable courtyard band: between the horizon and the top of the dock
            const areaTop = floorY + 30;
            const areaBottom = getDockTop() - 12;
            const span = Math.max(70, areaBottom - areaTop);

            // Two clean rows: crackers on one shared baseline, diyas on a lower baseline in the gaps between crackers
            const crackerBase = areaTop + span * 0.52;
            const diyaY = Math.min(areaBottom - 16, areaTop + span * 0.9);

            const rowW = Math.min(width * 0.94, 780);
            const colW = rowW / 5;
            const cx = width / 2;

            // [type, baseline offset so every cracker's bottom sits on the same line]
            const crackers = [
                ['chakri', -10],
                ['anaar', 0],
                ['wala1000', -6],
                ['rocket', -28],
                ['shot12', 0]
            ];
            crackers.forEach(([type, off], i) => {
                items.push(new DiwaliItem(type, cx + (i - 2) * colW, crackerBase + off, true));
            });

            for (let j = 0; j < 4; j++) {
                const diya = new DiwaliItem('diya', cx + (j - 1.5) * colW - 1, diyaY, true);
                if (j === 1 || j === 2) diya.state = 'active';
                items.push(diya);
            }

            items.sort((a, b) => a.y - b.y);
        }

        /**
         * ============================================================================
         * 6. MOBILE-FRIENDLY INTERACTION        /**
         * ============================================================================
         * 6. MOBILE-FRIENDLY INTERACTION & INPUT HANDLERS
         * Enlarged mobile touch hitboxes + swipe-to-ignite so mobile feels effortless!
         * ============================================================================
         */
        function checkFuseProximity(px, py) {
            for (const item of items) {
                if (item.state === 'unlit') {
                    const tip = item.getFuseTip();
                    const distTip = Math.hypot(px - tip.x, py - tip.y);
                    const distBody = Math.hypot(px - item.x, py - (item.y - 12));
                    // Generous 48px ignition radius so mobile fingers never miss the fuse
                    if (distTip < 48 || (activeTool === 'sparkler' && distBody < 42)) {
                        item.igniteFuse();
                    }
                }
            }
        }

        function handlePointerDown(x, y) {
            audio.init();
            pointer.x = x;
            pointer.y = y;
            pointer.active = true;

            // In Big Pooja Diya Mode: Tap near the wick to light or tap the bowl to ring the Pooja Bell & send golden ripples
            if (appMode === 'pooja') {
                const wickPos = getPoojaWickPos();
                const distToWick = Math.hypot(x - wickPos.x, y - wickPos.y);
                if (!poojaDiya.lit && distToWick < 95) {
                    poojaDiya.lit = true;
                    poojaDiya.flameHeightScale = 0.2;
                    audio.playPoojaBell();
                    for (let i = 0; i < 28; i++) {
                        const ang = Math.random() * Math.PI * 2;
                        const spd = 1.5 + Math.random() * 5;
                        sparks.push(new Spark(wickPos.x, wickPos.y, Math.cos(ang) * spd, Math.sin(ang) * spd - 1.5, '#FFD700', 2.4, 0.03, 0.04));
                    }
                } else if (poojaDiya.lit && distToWick < 130) {
                    // Gently fan the flame & chime sacred bell on touch
                    poojaDiya.windVelocity += (x < wickPos.x ? 0.14 : -0.14);
                    audio.playPoojaBell();
                    poojaDiya.oilRipples.push({ r: 4, alpha: 0.85 });
                }
                return;
            }

            // 1. First check if user tapped near ANY unlit cracker/diya to ignite it immediately
            for (const item of items) {
                if (item.state === 'unlit') {
                    const tip = item.getFuseTip();
                    const distTip = Math.hypot(x - tip.x, y - tip.y);
                    const distBody = Math.hypot(x - item.x, y - (item.y - 14));
                    if (distTip < 54 || distBody < 46) {
                        layoutDirty = true;
                        item.igniteFuse();
                        return;
                    }
                }
            }

            // 2. If user has selected a Diya or Cracker from the dock, place it on the floor
            if (activeTool !== 'sparkler' && y > floorY - 40 && y < getDockTop() - 6) {
                layoutDirty = true;
                const newItem = new DiwaliItem(activeTool, x, y);
                items.push(newItem);
                items.sort((a, b) => a.y - b.y);

                for (let i = 0; i < 8; i++) {
                    const ang = Math.random() * Math.PI * 2;
                    sparks.push(new Spark(x, y, Math.cos(ang) * 2, Math.sin(ang) * 1.5, '#FFD700', 1.6, 0.06));
                }
            }
        }

        function handlePointerMove(x, y) {
            const dx = x - pointer.x;
            const dy = y - pointer.y;
            pointer.vx = dx;
            pointer.vy = dy;
            pointer.x = x;
            pointer.y = y;
            pointer.active = true;

            if (appMode === 'pooja') {
                const wickPos = getPoojaWickPos();
                const dist = Math.hypot(x - wickPos.x, y - wickPos.y);
                if (!poojaDiya.lit && dist < 75) {
                    poojaDiya.lit = true;
                    poojaDiya.flameHeightScale = 0.25;
                    audio.playPoojaBell();
                } else if (poojaDiya.lit && dist < 160) {
                    // Passing hand or sparkler near the flame makes it sway smoothly like real air draft!
                    poojaDiya.windVelocity += Math.max(-0.08, Math.min(0.08, dx * 0.0025));
                }
                return;
            }

            checkFuseProximity(x, y);
        }

        canvas.addEventListener('mousedown', (e) => handlePointerDown(e.clientX, e.clientY));
        canvas.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));

        canvas.addEventListener('touchstart', (e) => {
            if (e.cancelable) e.preventDefault();
            if (e.touches.length > 0) {
                handlePointerDown(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (e.cancelable) e.preventDefault();
            if (e.touches.length > 0) {
                handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        // Mode Switch Buttons (Courtyard vs Big Pooja Diya)
        const courtyardModeBtn = document.getElementById('courtyardModeBtn');
        const poojaModeBtn = document.getElementById('poojaModeBtn');
        const crackerDock = document.getElementById('crackerDock');

        courtyardModeBtn.addEventListener('click', () => {
            audio.init();
            appMode = 'courtyard';
            courtyardModeBtn.classList.add('active');
            poojaModeBtn.classList.remove('active');
            crackerDock.classList.remove('dock-hidden');
        });

        poojaModeBtn.addEventListener('click', () => {
            audio.init();
            appMode = 'pooja';
            poojaModeBtn.classList.add('active');
            courtyardModeBtn.classList.remove('active');
            crackerDock.classList.add('dock-hidden');
            if (poojaDiya.lit) audio.playPoojaBell();
        });

        // Tool Dock Selection
        const toolButtons = document.querySelectorAll('[data-tool]');
        toolButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                audio.init();
                toolButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeTool = btn.getAttribute('data-tool');
                const target = btn.offsetLeft - (dockScroll.clientWidth - btn.offsetWidth) / 2;
                dockScroll.scrollTo({ left: target, behavior: 'smooth' });
            });
        });

        // Dock scrolling: touch works natively; mouse gets drag + wheel; edge fades show more items
        const dockScroll = document.getElementById('dockScroll');
        function updateDockFade() {
            const max = dockScroll.scrollWidth - dockScroll.clientWidth;
            dockScroll.classList.toggle('fade-l', dockScroll.scrollLeft > 4);
            dockScroll.classList.toggle('fade-r', dockScroll.scrollLeft < max - 4);
        }
        dockScroll.addEventListener('scroll', updateDockFade, { passive: true });
        dockScroll.addEventListener('wheel', (e) => {
            if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
                dockScroll.scrollLeft += e.deltaY;
                e.preventDefault();
            }
        }, { passive: false });
        let dockDrag = false, dockMoved = false, dockStartX = 0, dockStartScroll = 0;
        dockScroll.addEventListener('mousedown', (e) => {
            dockDrag = true; dockMoved = false;
            dockStartX = e.pageX; dockStartScroll = dockScroll.scrollLeft;
        });
        window.addEventListener('mousemove', (e) => {
            if (!dockDrag) return;
            const dx = e.pageX - dockStartX;
            if (Math.abs(dx) > 5) dockMoved = true;
            dockScroll.scrollLeft = dockStartScroll - dx;
        });
        window.addEventListener('mouseup', () => { dockDrag = false; });
        dockScroll.addEventListener('click', (e) => {
            if (dockMoved) { e.stopPropagation(); e.preventDefault(); dockMoved = false; }
        }, true);
        updateDockFade();

        // Sound Mute Toggle
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundOnIcon = document.getElementById('soundOnIcon');
        const soundOffIcon = document.getElementById('soundOffIcon');
        soundToggleBtn.addEventListener('click', () => {
            audio.init();
            audio.muted = !audio.muted;
            soundOnIcon.classList.toggle('hidden', audio.muted);
            soundOffIcon.classList.toggle('hidden', !audio.muted);
        });

        // Reset Button (In Pooja Mode: toggles unlit/lit so user can re-light the big Diya!)
        document.getElementById('clearBtn').addEventListener('click', () => {
            audio.init();
            if (appMode === 'pooja') {
                poojaDiya.lit = false;
                poojaDiya.flameHeightScale = 0;
            } else {
                populateDefaultCourtyard();
            }
        });

        /**
         * ============================================================================
         * 7. BIG SACRED POOJA DIYA RENDERER (Real-Time Multi-Layered Fluid Flame)
         * ============================================================================
         */
        function getPoojaWickPos() {
            const scale = Math.min(width, height) < 500 ? 0.78 : 1.05;
            const cx = width / 2;
            const cy = height * 0.62;
            return {
                x: cx + 78 * scale,
                y: cy - 38 * scale,
                scale,
                cx,
                cy
            };
        }

        function drawPoojaDiyaScene() {
            poojaDiya.time += 0.035;
            const t = poojaDiya.time;
            const { x: wickX, y: wickY, scale, cx, cy } = getPoojaWickPos();

            // Spring-damper physics for air currents affecting the flame
            const naturalDraft = Math.sin(t * 1.1) * 0.04 + Math.sin(t * 2.7) * 0.025 + Math.cos(t * 4.3) * 0.015;
            const targetWind = naturalDraft;
            poojaDiya.windVelocity += (targetWind - poojaDiya.windAngle) * 0.04;
            poojaDiya.windVelocity *= 0.90; // Damping
            poojaDiya.windAngle += poojaDiya.windVelocity;

            if (poojaDiya.lit && poojaDiya.flameHeightScale < 1) {
                poojaDiya.flameHeightScale = Math.min(1, poojaDiya.flameHeightScale + 0.035);
            }

            const lightPower = poojaDiya.lit ? poojaDiya.flameHeightScale : 0.04;
            const breath = 1 + Math.sin(t * 3.2) * 0.035 + Math.cos(t * 5.8) * 0.015;

            // 1. Deep Dark Sanctum Background with Warm Radial Room Illumination
            ctx.fillStyle = '#040203';
            ctx.fillRect(0, 0, width, height);

            const roomGlowRadius = Math.max(width, height) * (0.75 * lightPower * breath);
            if (roomGlowRadius > 5) {
                const roomGrad = ctx.createRadialGradient(wickX, wickY - 60 * scale, 10, wickX, cy, roomGlowRadius);
                roomGrad.addColorStop(0, `rgba(255, 195, 70, ${0.42 * lightPower})`);
                roomGrad.addColorStop(0.35, `rgba(215, 85, 10, ${0.22 * lightPower})`);
                roomGrad.addColorStop(0.7, `rgba(95, 22, 5, ${0.12 * lightPower})`);
                roomGrad.addColorStop(1, 'rgba(4, 2, 3, 0)');
                ctx.fillStyle = roomGrad;
                ctx.fillRect(0, 0, width, height);
            }

            // 2. Rotating Sacred Brass Prabha Mandala Behind the Diya
            ctx.save();
            ctx.translate(cx, cy + 55 * scale);
            ctx.scale(1, 0.36);
            ctx.rotate(t * 0.08);
            const mandalaAlpha = 0.12 + 0.25 * lightPower;
            ctx.strokeStyle = `rgba(255, 195, 55, ${mandalaAlpha})`;
            ctx.lineWidth = 2;
            for (let i = 0; i < 16; i++) {
                ctx.rotate(Math.PI / 8);
                ctx.beginPath();
                ctx.ellipse(110 * scale, 0, 68 * scale, 26 * scale, 0, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.beginPath();
            ctx.arc(0, 0, 195 * scale, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            // 3. Ornate Brass Pedestal Base
            ctx.save();
            ctx.translate(cx, cy);

            // Floor shadow / golden reflection pool
            const floorPool = ctx.createRadialGradient(0, 72 * scale, 10, 0, 72 * scale, 180 * scale);
            floorPool.addColorStop(0, `rgba(255, 165, 30, ${0.35 * lightPower})`);
            floorPool.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = floorPool;
            ctx.beginPath();
            ctx.ellipse(0, 72 * scale, 180 * scale, 42 * scale, 0, 0, Math.PI * 2);
            ctx.fill();

            // Brass Stem & Lotus Base
            const brassGrad = ctx.createLinearGradient(-90 * scale, 0, 90 * scale, 0);
            brassGrad.addColorStop(0, '#5C2209');
            brassGrad.addColorStop(0.3, '#B45309');
            brassGrad.addColorStop(0.5, '#F59E0B');
            brassGrad.addColorStop(0.7, '#B45309');
            brassGrad.addColorStop(1, '#451A03');

            ctx.fillStyle = brassGrad;
            ctx.strokeStyle = '#FDE047';
            ctx.lineWidth = 1.8 * scale;
            ctx.beginPath();
            ctx.ellipse(0, 65 * scale, 78 * scale, 18 * scale, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Carved Diya Bowl (Deep Terracotta & Brass Rim)
            const bowlGrad = ctx.createLinearGradient(-110 * scale, -35 * scale, 110 * scale, 55 * scale);
            bowlGrad.addColorStop(0, '#7C2D12');
            bowlGrad.addColorStop(0.45, '#B83B14');
            bowlGrad.addColorStop(0.8, '#7C2D12');
            bowlGrad.addColorStop(1, '#431407');

            ctx.fillStyle = bowlGrad;
            ctx.strokeStyle = '#FBBF24';
            ctx.lineWidth = 2.5 * scale;
            ctx.beginPath();
            ctx.moveTo(-105 * scale, -28 * scale);
            ctx.bezierCurveTo(-95 * scale, 52 * scale, 85 * scale, 58 * scale, 112 * scale, -32 * scale);
            ctx.lineTo(75 * scale, -36 * scale);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Decorative Carved Lotus Petals on Diya Bowl
            ctx.strokeStyle = 'rgba(253, 224, 71, 0.45)';
            ctx.lineWidth = 1.5 * scale;
            for (let i = -3; i <= 3; i++) {
                const px = i * 24 * scale;
                ctx.beginPath();
                ctx.moveTo(px, -18 * scale);
                ctx.quadraticCurveTo(px, 24 * scale, px * 0.6, 36 * scale);
                ctx.stroke();
            }

            // Warm Ghee / Sesame Oil Reservoir Inside the Diya
            const oilGrad = ctx.createRadialGradient(45 * scale, -30 * scale, 5, 0, -30 * scale, 105 * scale);
            oilGrad.addColorStop(0, poojaDiya.lit ? '#F59E0B' : '#78350F');
            oilGrad.addColorStop(0.55, '#7C2D12');
            oilGrad.addColorStop(1, '#3B0D04');

            ctx.fillStyle = oilGrad;
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 3 * scale;
            ctx.beginPath();
            ctx.ellipse(4 * scale, -30 * scale, 106 * scale, 22 * scale, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Oil Surface Shimmer Ripples
            for (let i = poojaDiya.oilRipples.length - 1; i >= 0; i--) {
                const rp = poojaDiya.oilRipples[i];
                rp.r += 1.4;
                rp.alpha -= 0.018;
                if (rp.alpha <= 0) {
                    poojaDiya.oilRipples.splice(i, 1);
                    continue;
                }
                ctx.strokeStyle = `rgba(255, 230, 130, ${rp.alpha})`;
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.ellipse(25 * scale, -30 * scale, rp.r * scale, rp.r * 0.22 * scale, 0, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Thick Braided Cotton Wick Emerging from Spout
            ctx.strokeStyle = poojaDiya.lit ? '#451A03' : '#FEF08A';
            ctx.lineWidth = 6.5 * scale;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(48 * scale, -28 * scale);
            ctx.quadraticCurveTo(68 * scale, -32 * scale, 78 * scale, -38 * scale);
            ctx.stroke();

            // Glowing Ember Tip on Wick
            if (poojaDiya.lit) {
                ctx.fillStyle = '#FF4500';
                ctx.beginPath();
                ctx.arc(78 * scale, -38 * scale, 4.5 * scale, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Pulsing ring inviting user to touch wick with Phuljhari
                const pulse = (8 + Math.sin(t * 4) * 3) * scale;
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.75)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(78 * scale, -38 * scale, pulse, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();

            // 4. REAL-TIME MULTI-LAYERED FLUID FLAME ANIMATION
            if (poojaDiya.lit && poojaDiya.flameHeightScale > 0.01) {
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';

                const fh = 155 * scale * poojaDiya.flameHeightScale * breath;
                const fw = 36 * scale * poojaDiya.flameHeightScale;

                // Smooth organic multi-harmonic wave along the height of the flame
                const tipSwayX = Math.sin(t * 3.4) * 9 * scale
                              + Math.cos(t * 6.1) * 4.5 * scale
                              + poojaDiya.windAngle * 190 * scale;
                const midSwayX = Math.sin(t * 3.4 - 0.7) * 4 * scale
                              + poojaDiya.windAngle * 75 * scale;
                const tipStretchY = Math.sin(t * 5.2) * 7 * scale;

                // Soft bloom halo around the entire flame
                const haloGrad = ctx.createRadialGradient(
                    wickX + midSwayX, wickY - fh * 0.45, 4,
                    wickX + midSwayX, wickY - fh * 0.45, fh * 1.45
                );
                haloGrad.addColorStop(0, 'rgba(255, 210, 90, 0.55)');
                haloGrad.addColorStop(0.4, 'rgba(255, 105, 0, 0.22)');
                haloGrad.addColorStop(1, 'rgba(255, 50, 0, 0)');
                ctx.fillStyle = haloGrad;
                ctx.beginPath();
                ctx.arc(wickX + midSwayX, wickY - fh * 0.45, fh * 1.45, 0, Math.PI * 2);
                ctx.fill();

                // Helper to draw smooth Bezier teardrop flame layers
                const drawFlameLayer = (widthScale, heightScale, swayFactor, gradColors) => {
                    const lw = fw * widthScale;
                    const lh = (fh + tipStretchY) * heightScale;
                    const tx = wickX + tipSwayX * swayFactor;
                    const ty = wickY - lh;
                    const mx = wickX + midSwayX * swayFactor;

                    const g = ctx.createLinearGradient(wickX, wickY + 8 * scale, tx, ty);
                    gradColors.forEach(([stop, col]) => g.addColorStop(stop, col));

                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.moveTo(wickX, wickY + 4 * scale);
                    // Left belly to tip
                    ctx.bezierCurveTo(
                        wickX - lw * 1.15, wickY - lh * 0.22,
                        mx - lw * 0.65, wickY - lh * 0.72,
                        tx, ty
                    );
                    // Tip back down right belly
                    ctx.bezierCurveTo(
                        mx + lw * 0.65, wickY - lh * 0.72,
                        wickX + lw * 1.15, wickY - lh * 0.22,
                        wickX, wickY + 4 * scale
                    );
                    ctx.closePath();
                    ctx.fill();
                };

                // Layer 1: Outer Deep Saffron-Crimson Aura
                drawFlameLayer(1.22, 1.06, 1.08, [
                    [0, 'rgba(255, 60, 0, 0.15)'],
                    [0.3, 'rgba(255, 95, 0, 0.65)'],
                    [0.85, 'rgba(255, 160, 20, 0.35)'],
                    [1, 'rgba(255, 200, 50, 0)']
                ]);

                // Layer 2: Primary Rich Golden-Marigold Body
                drawFlameLayer(0.92, 0.94, 0.95, [
                    [0, 'rgba(30, 90, 255, 0.45)'], // Subtle oxygen-rich blue base near wick
                    [0.18, 'rgba(255, 140, 0, 0.88)'],
                    [0.65, 'rgba(255, 215, 40, 0.92)'],
                    [1, 'rgba(255, 240, 150, 0.1)']
                ]);

                // Layer 3: Radiant White-Hot Inner Core
                drawFlameLayer(0.52, 0.66, 0.7, [
                    [0, 'rgba(120, 180, 255, 0.55)'],
                    [0.25, 'rgba(255, 250, 220, 0.98)'],
                    [0.8, 'rgba(255, 240, 170, 0.85)'],
                    [1, 'rgba(255, 220, 100, 0)']
                ]);

                // Occasional gentle sacred prana embers floating upward from the flame tip
                if (Math.random() < 0.14) {
                    sparks.push(new Spark(
                        wickX + tipSwayX * 0.8 + (Math.random() - 0.5) * 6,
                        wickY - fh * 0.85,
                        (Math.random() - 0.5) * 0.45 + poojaDiya.windAngle * 2,
                        -1.1 - Math.random() * 1.1,
                        '#FFD700',
                        1.8,
                        0.018,
                        -0.015
                    ));
                }

                ctx.restore();
            }
        }

        /**
         * ============================================================================
         * 8. RENDERING COURTYARD, RANGOLI MANDALA & PHULJHARI SPARKLER
         * ============================================================================
         */
        function drawBackgroundAndCourtyard(litDiyaCount) {
            // Pure Light Celebration: Room illumination grows with every lit Diya & Cracker (Zero Smoke)
            const ambientBoost = Math.min(1, (litDiyaCount * 0.12) + (sparks.length * 0.0018) + screenFlash);

            // Deep Night Sky to Warm Illuminated Courtyard Gradient
            const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
            bgGrad.addColorStop(0, '#040203');
            bgGrad.addColorStop(0.58, `rgb(${16 + ambientBoost * 45}, ${6 + ambientBoost * 18}, ${8 + ambientBoost * 8})`);
            bgGrad.addColorStop(1, `rgb(${28 + ambientBoost * 65}, ${10 + ambientBoost * 26}, ${6 + ambientBoost * 10})`);
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // Screen Flash overlay from Sutli Bomb / Sky bursts
            if (screenFlash > 0.01) {
                ctx.fillStyle = `rgba(${screenFlashColor}, ${screenFlash * 0.35})`;
                ctx.fillRect(0, 0, width, height);
                // light spilling across the courtyard floor in the colour of the burst
                const fg = ctx.createLinearGradient(0, floorY, 0, height);
                fg.addColorStop(0, `rgba(${screenFlashColor}, ${screenFlash * 0.22})`);
                fg.addColorStop(1, `rgba(${screenFlashColor}, ${screenFlash * 0.05})`);
                ctx.fillStyle = fg;
                ctx.fillRect(0, floorY, width, height - floorY);
                screenFlash *= 0.86;
            }

            // Courtyard Horizon Divider Line
            ctx.strokeStyle = `rgba(255, 180, 40, ${0.18 + ambientBoost * 0.25})`;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, floorY);
            ctx.lineTo(width, floorY);
            ctx.stroke();

            // Subtle Traditional Floor Rangoli Mandala in Center of Courtyard
            ctx.save();
            ctx.translate(width / 2, floorY + (height - floorY) * 0.42);
            ctx.scale(1, 0.42);
            const rangoliAlpha = 0.12 + ambientBoost * 0.22;
            ctx.strokeStyle = `rgba(255, 190, 40, ${rangoliAlpha})`;
            ctx.lineWidth = 2;

            for (let i = 0; i < 12; i++) {
                ctx.rotate(Math.PI / 6);
                ctx.beginPath();
                ctx.ellipse(48, 0, 32, 14, 0, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.beginPath();
            ctx.arc(0, 0, 88, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        function drawLivePhuljhari() {
            const x = pointer.x;
            const y = pointer.y;

            // Emit continuous live Phuljhari sparks from tip
            for (let i = 0; i < 2; i++) {
                const ang = Math.random() * Math.PI * 2;
                const spd = 1.2 + Math.random() * 3.8;
                sparks.push(new Spark(
                    x,
                    y,
                    Math.cos(ang) * spd,
                    Math.sin(ang) * spd,
                    Math.random() > 0.3 ? '#FFD700' : '#FFFBEB',
                    1.5,
                    0.075,
                    0.08
                ));
            }
            if (Math.random() < 0.18) {
                audio.playSparkPop(3800, 0.015);
            }

            ctx.save();
            // Hand-held Phuljhari stem
            ctx.strokeStyle = '#9CA3AF';
            ctx.lineWidth = 3.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x + 28, y + 28);
            ctx.lineTo(x, y);
            ctx.stroke();

            // Glowing tip halo
            const g = ctx.createRadialGradient(x, y, 1, x, y, 42);
            g.addColorStop(0, 'rgba(255, 250, 210, 0.95)');
            g.addColorStop(0.35, 'rgba(255, 180, 0, 0.45)');
            g.addColorStop(1, 'rgba(255, 100, 0, 0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(x, y, 42, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        /**
         * ============================================================================
         * 8. MAIN ANIMATION LOOP
         * ============================================================================
         */
        function animate() {
            if (appMode === 'pooja') {
                drawPoojaDiyaScene();
            } else {
                // Count active Diyas for real-time room brightness
                let litDiyas = 0;
                for (let i = items.length - 1; i >= 0; i--) {
                    if (items[i].type === 'diya' && items[i].state === 'active') litDiyas++;
                    if (items[i].state === 'done') items.splice(i, 1);
                }

                drawBackgroundAndCourtyard(litDiyas);

                // Update & Render Items (Diyas & Crackers)
                for (const item of items) {
                    item.update();
                    item.draw(ctx);
                }
            }

            // Update & Render Shockwaves, Aerial Shells, and Sparks with Additive Blending
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';

            for (let i = aerialShells.length - 1; i >= 0; i--) {
                aerialShells[i].update();
                aerialShells[i].draw(ctx);
                if (aerialShells[i].done) aerialShells.splice(i, 1);
            }

            for (let i = shockwaves.length - 1; i >= 0; i--) {
                shockwaves[i].update();
                shockwaves[i].draw(ctx);
                if (shockwaves[i].alpha <= 0) shockwaves.splice(i, 1);
            }

            if (sparks.length > 3200) sparks.splice(0, sparks.length - 3200);
            for (let i = sparks.length - 1; i >= 0; i--) {
                sparks[i].update();
                sparks[i].draw(ctx);
                if (sparks[i].alpha <= 0) sparks.splice(i, 1);
            }

            // Show live Phuljhari in Courtyard mode, or in Pooja mode when the big Diya is unlit
            if (appMode === 'courtyard' || !poojaDiya.lit) {
                drawLivePhuljhari();
            }
            ctx.restore();

            requestAnimationFrame(animate);
        }

        window.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            populateDefaultCourtyard();
            updateDockFade();
            animate();
        });
        // Re-align once fonts/styles have settled so the dock height is exact
        window.addEventListener('load', () => {
            if (!layoutDirty) populateDefaultCourtyard();
            updateDockFade();
        });

        // Dark-room comfort: keep the screen awake and dim the UI when idle
        (async () => {
            try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
        })();
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible') {
                try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
            }
        });
        let idleTimer = null;
        function wakeUI() {
            document.documentElement.classList.remove('ui-dim');
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => document.documentElement.classList.add('ui-dim'), 6000);
        }
        ['pointerdown', 'pointermove', 'touchstart', 'keydown'].forEach(ev => window.addEventListener(ev, wakeUI, { passive: true }));
        wakeUI();
    </script>
</body>
</html>
