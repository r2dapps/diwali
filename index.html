    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #040203;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .font-traditional {
            font-family: 'Cinzel', serif;
        }
        .brass-panel {
            background: linear-gradient(145deg, rgba(38, 16, 10, 0.92), rgba(16, 6, 4, 0.96));
            border: 1.5px solid rgba(255, 190, 40, 0.35);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.75), inset 0 1px 1px rgba(255, 225, 130, 0.25);
            backdrop-filter: blur(12px);
        }
        .glow-text {
            text-shadow: 0 0 14px rgba(255, 190, 40, 0.65);
        }
        .item-slot {
            background: rgba(24, 9, 6, 0.75);
            border: 1px solid rgba(255, 180, 40, 0.22);
            transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .item-slot:hover {
            border-color: rgba(255, 200, 60, 0.6);
            transform: translateY(-2px);
        }
        .item-slot.active {
            background: linear-gradient(145deg, rgba(140, 45, 10, 0.9), rgba(75, 20, 5, 0.95));
            border: 1.5px solid #FFD700;
            box-shadow: 0 0 18px rgba(255, 180, 0, 0.45);
            transform: translateY(-3px) scale(1.03);
        }
        .mode-btn.active {
            background: linear-gradient(135deg, #F59E0B, #B45309);
            color: #FFFBEB;
            border-color: #FEF08A;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.55);
        }
        /* Screen Shake Effect for Sutli Bomb & Garland Lads */
        .shake {
            animation: screenShake 0.35s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes screenShake {
            10%, 90% { transform: translate3d(-4px, 3px, 0); }
            20%, 80% { transform: translate3d(6px, -4px, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, -2px, 0); }
            40%, 60% { transform: translate3d(8px, 4px, 0); }
        }

        /* Hide scrollbars on the horizontal cracker dock */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        canvas { touch-action: none; }
        header { top: max(12px, env(safe-area-inset-top)) !important; }

        /* ---- Cracker dock: reliable horizontal scroll on touch + mouse ---- */
        #crackerDock {
            position: fixed;
            left: 0; right: 0;
            bottom: max(10px, env(safe-area-inset-bottom));
            z-index: 20;
            display: flex;
            justify-content: center;
            padding: 0 8px;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        #crackerDock.dock-hidden { opacity: 0; }
        #crackerDock.dock-hidden #dockScroll { pointer-events: none; }
        #dockScroll {
            position: relative;
            pointer-events: auto;
            display: flex;
            align-items: stretch;
            gap: 8px;
            width: max-content;
            max-width: 100%;
            padding: 12px 10px 8px;
            overflow-x: scroll;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
            overscroll-behavior-x: contain;
            cursor: grab;
        }
        #dockScroll.fade-r { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 30px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 30px), transparent); }
        #dockScroll.fade-l { -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 30px), transparent); mask-image: linear-gradient(to left, #000 calc(100% - 30px), transparent); }
        #dockScroll.fade-l.fade-r { -webkit-mask-image: linear-gradient(to right, transparent, #000 30px, #000 calc(100% - 30px), transparent); mask-image: linear-gradient(to right, transparent, #000 30px, #000 calc(100% - 30px), transparent); }
        #dockScroll .item-slot { flex: 0 0 auto; }

        /* Dim the UI when idle so the dark room stays dark */
        .brass-panel { transition: opacity 0.6s ease; }
        .ui-dim .brass-panel { opacity: 0.28; }
    </style>
</head>

    <script>
        /**
         * ============================================================================
         * 1. PROCEDURAL WEB AUDIO ENGINE (Zero External MP3s)
         * Pure Diwali acoustics & Zero-Pollution celebration logic built-in.
         * Upgraded Chakri rhythmic fizzy spin, Rocket aerodynamic whoosh,
         * Rapid-fire Garland Lads (100 to 10,000 Wala), and Multi-Shot mortar thumps.
         * ============================================================================
         */
        class DiwaliSoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.noiseBuffer = null;
            }

            init() {
                if (this.ctx) {
                    if (this.ctx.state === 'suspended') this.ctx.resume();
                    return;
                }
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioCtx();

                // Create 2-second white noise buffer for fire, fuses, and explosions
                const sampleRate = this.ctx.sampleRate;
                this.noiseBuffer = this.ctx.createBuffer(1, sampleRate * 2, sampleRate);
                const output = this.noiseBuffer.getChannelData(0);
                for (let i = 0; i < sampleRate * 2; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                // Master bus: compressor (so dense lads never clip) + street-echo convolver
                this.comp = this.ctx.createDynamicsCompressor();
                this.comp.threshold.value = -16;
                this.comp.knee.value = 12;
                this.comp.ratio.value = 6;
                this.comp.attack.value = 0.002;
                this.comp.release.value = 0.2;
                this.comp.connect(this.ctx.destination);

                this.bus = this.ctx.createGain();
                this.bus.gain.value = 1;
                this.bus.connect(this.comp);

                const irLen = Math.floor(sampleRate * 1.5);
                const ir = this.ctx.createBuffer(2, irLen, sampleRate);
                for (let ch = 0; ch < 2; ch++) {
                    const d = ir.getChannelData(ch);
                    for (let i = 0; i < irLen; i++) {
                        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLen, 3.4);
                    }
                }
                this.verb = this.ctx.createConvolver();
                this.verb.buffer = ir;
                this.verb.connect(this.comp);
                this.trainSources = new Set();
            }

            // Route a node to the master bus with an optional echo send
            route(node, wet = 0.15) {
                node.connect(this.bus);
                if (wet > 0) {
                    const send = this.ctx.createGain();
                    send.gain.value = wet;
                    node.connect(send);
                    send.connect(this.verb);
                }
            }

            noiseAt(t, dur) {
                const src = this.ctx.createBufferSource();
                src.buffer = this.noiseBuffer;
                src.start(t, Math.random() * Math.max(0, 2 - dur - 0.05), dur);
                return src;
            }

            // Burning-fuse sizzle (rocket, sutli, lads, batteries)
            playFuseHiss(duration = 0.9, vol = 0.05) {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const src = this.ctx.createBufferSource();
                src.buffer = this.noiseBuffer;
                src.loop = true;
                const bp = this.ctx.createBiquadFilter();
                bp.type = 'bandpass';
                bp.frequency.value = 5200;
                bp.Q.value = 0.6;
                const g = this.ctx.createGain();
                const n = Math.max(8, Math.floor(duration * 45));
                const curve = new Float32Array(n);
                for (let i = 0; i < n; i++) curve[i] = vol * (0.35 + Math.random() * 0.9);
                curve[n - 1] = 0;
                g.gain.setValueCurveAtTime(curve, now, duration);
                src.connect(bp);
                bp.connect(g);
                this.route(g, 0.05);
                src.start(now);
                src.stop(now + duration + 0.02);
            }

            stopTrains() {
                if (!this.trainSources) return;
                this.trainSources.forEach(s => { try { s.stop(); } catch (e) {} });
                this.trainSources.clear();
            }

            /**
             * Cracker-lad train. The whole string is rendered as ONE audio buffer so
             * that a 100-wala is a clean "tak-tak-tak" and a 10,000-wala is a thunderous roll.
             *  kind 'thread' -> straight hanging string, steady distinct cracks
             *  kind 'roll'   -> big coiled roll, builds into a dense machine-gun roar
             */
            playCrackerTrain(popCount, duration, weight = 0.4, kind = 'thread', perBeat = 1) {
                if (this.muted || !this.ctx) return;
                const sr = this.ctx.sampleRate;
                const len = Math.floor((duration + 0.5) * sr);
                const buf = this.ctx.createBuffer(1, len, sr);
                const d = buf.getChannelData(0);

                const addPop = (s0, amp, w) => {
                    const L = Math.floor(sr * (0.02 + w * 0.03));
                    const decC = Math.exp(-1 / ((0.0011 + Math.random() * 0.0008) * sr));
                    const decB = Math.exp(-1 / ((0.005 + w * 0.012) * sr));
                    const decT = Math.exp(-1 / (0.011 * sr));
                    const a = 0.1 + (1 - w) * 0.25;
                    const f0 = 130 + w * 90;
                    let ec = 1, eb = 1, et = 1, lp = 0, ph = 0;
                    const end = Math.min(L, len - s0);
                    for (let j = 0; j < end; j++) {
                        const n = Math.random() * 2 - 1;
                        lp += (n - lp) * a;
                        let v = n * ec * 0.9 + lp * eb * (1.5 + w * 2.2);
                        if (w > 0.35) {
                            ph += 6.2832 * (f0 * Math.exp(-j / (sr * 0.016)) + 42) / sr;
                            v += Math.sin(ph) * et * w * 1.3;
                        }
                        d[s0 + j] += v * amp;
                        ec *= decC; eb *= decB; et *= decT;
                    }
                };

                // One beat every 0.05 s; bigger lads fire several crackers on each beat
                const STEP = 0.05;
                const beats = Math.max(1, Math.round(duration / STEP));
                for (let bi = 0; bi < beats; bi++) {
                    for (let k = 0; k < perBeat; k++) {
                        const jitter = perBeat === 1 ? (Math.random() - 0.5) * 0.006 : (Math.random() - 0.5) * 0.03;
                        const t0 = Math.max(0, bi * STEP + jitter);
                        const s0 = Math.floor(t0 * sr);
                        const amp = kind === 'thread' ? (0.5 + Math.random() * 0.5) : (0.3 + Math.random() * 0.6);
                        addPop(s0, amp, weight * (0.8 + Math.random() * 0.4));
                    }
                }

                // Street echo (comb) + soft clip
                const ed = Math.floor(0.075 * sr);
                for (let i = ed; i < len; i++) d[i] += d[i - ed] * 0.17;
                for (let i = 0; i < len; i++) d[i] = Math.tanh(d[i] * 0.85);

                const src = this.ctx.createBufferSource();
                src.buffer = buf;
                const g = this.ctx.createGain();
                g.gain.value = kind === 'roll' ? 0.8 : 0.72;
                src.connect(g);
                this.route(g, 0.1);
                this.trainSources.add(src);
                src.onended = () => this.trainSources.delete(src);
                src.start(this.ctx.currentTime);
            }

            // Lad finale: the heavy head cracker at the very end of the string
            playLadFinale(tier = 1) {
                this.playSutliBomb(0.75 + tier * 0.22);
                this.playChitChitCluster(8 + tier * 4, 0.5);
            }

            // Real sutli bomb: sharp paper-tearing CRACK + chest thump + street echo
            playSutliBomb(size = 1) {
                if (this.muted || !this.ctx) return;
                const t = this.ctx.currentTime;

                // 1. Instant sharp crack
                const crack = this.noiseAt(t, 0.12);
                const hp = this.ctx.createBiquadFilter();
                hp.type = 'highpass';
                hp.frequency.value = 1100;
                const cg = this.ctx.createGain();
                cg.gain.setValueAtTime(1.0 * size, t);
                cg.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
                crack.connect(hp); hp.connect(cg);
                this.route(cg, 0.3);

                // 2. Body of the blast (tight, drops fast)
                const body = this.noiseAt(t, 0.45);
                const lp = this.ctx.createBiquadFilter();
                lp.type = 'lowpass';
                lp.frequency.setValueAtTime(2800, t);
                lp.frequency.exponentialRampToValueAtTime(180, t + 0.3);
                const bg = this.ctx.createGain();
                bg.gain.setValueAtTime(0.75 * size, t);
                bg.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
                body.connect(lp); lp.connect(bg);
                this.route(bg, 0.35);

                // 3. Short thump
                const o = this.ctx.createOscillator();
                const og = this.ctx.createGain();
                o.type = 'sine';
                o.frequency.setValueAtTime(115, t);
                o.frequency.exponentialRampToValueAtTime(34, t + 0.2);
                og.gain.setValueAtTime(0.75 * size, t);
                og.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
                o.connect(og);
                this.route(og, 0.2);
                o.start(t); o.stop(t + 0.26);

                // 4. Wall slap-back echo
                const slap = this.noiseAt(t + 0.11, 0.2);
                const sl = this.ctx.createBiquadFilter();
                sl.type = 'lowpass';
                sl.frequency.value = 1400;
                const sg = this.ctx.createGain();
                sg.gain.setValueAtTime(0.0001, t);
                sg.gain.setValueAtTime(0.32 * size, t + 0.11);
                sg.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);
                slap.connect(sl); sl.connect(sg);
                this.route(sg, 0.3);

                // 5. Torn paper bits landing
                for (let i = 0; i < 6; i++) {
                    const tt = t + 0.1 + Math.random() * 0.3;
                    const bit = this.noiseAt(tt, 0.03);
                    const bf = this.ctx.createBiquadFilter();
                    bf.type = 'bandpass';
                    bf.frequency.value = 3000 + Math.random() * 3000;
                    bf.Q.value = 3;
                    const bgn = this.ctx.createGain();
                    bgn.gain.setValueAtTime(0.06, tt);
                    bgn.gain.exponentialRampToValueAtTime(0.0001, tt + 0.03);
                    bit.connect(bf); bf.connect(bgn);
                    this.route(bgn, 0.05);
                }
            }

            // Aerial shell break: soft-edged crack, deep chest "dhoom", rolling echo off the buildings
            playBurstBoom(size = 1) {
                if (this.muted || !this.ctx) return;
                const t = this.ctx.currentTime + 0.14; // sound lags the flash, like real distance

                // Soft saturation so the low end hits without harshness
                const shaper = this.ctx.createWaveShaper();
                const curve = new Float32Array(256);
                for (let i = 0; i < 256; i++) { const x = i / 128 - 1; curve[i] = Math.tanh(x * 2.2); }
                shaper.curve = curve;

                // 1. Crack (band-limited, not hissy)
                const crack = this.noiseAt(t, 0.12);
                const cb = this.ctx.createBiquadFilter();
                cb.type = 'bandpass'; cb.frequency.value = 1300; cb.Q.value = 0.55;
                const cl = this.ctx.createBiquadFilter();
                cl.type = 'lowpass'; cl.frequency.value = 5000;
                const cg = this.ctx.createGain();
                cg.gain.setValueAtTime(0.0001, t);
                cg.gain.linearRampToValueAtTime(0.7 * size, t + 0.004);
                cg.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
                crack.connect(cb); cb.connect(cl); cl.connect(cg);
                this.route(cg, 0.4);

                // 2. Body: low rolling thunder of the shell
                const body = this.noiseAt(t, 1.2);
                const bl = this.ctx.createBiquadFilter();
                bl.type = 'lowpass';
                bl.frequency.setValueAtTime(1400, t);
                bl.frequency.exponentialRampToValueAtTime(90, t + 1.0);
                const bg = this.ctx.createGain();
                bg.gain.setValueAtTime(0.0001, t);
                bg.gain.linearRampToValueAtTime(0.6 * size, t + 0.012);
                bg.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
                body.connect(bl); bl.connect(bg);
                this.route(bg, 0.55);

                // 3. Deep chest thump
                const o = this.ctx.createOscillator();
                const og = this.ctx.createGain();
                o.type = 'sine';
                o.frequency.setValueAtTime(78, t);
                o.frequency.exponentialRampToValueAtTime(26, t + 0.55);
                og.gain.setValueAtTime(0.0001, t);
                og.gain.linearRampToValueAtTime(0.85 * size, t + 0.008);
                og.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
                o.connect(shaper); shaper.connect(og);
                this.route(og, 0.3);
                o.start(t); o.stop(t + 0.65);
            }

            // Sharp metallic spark pop
            playSparkPop(freq = 2800, vol = 0.04) {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const src = this.ctx.createBufferSource();
                src.buffer = this.noiseBuffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(freq + Math.random() * 1400, now);
                filter.Q.setValueAtTime(6, now);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(vol, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.045);

                src.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                src.start(now, Math.random() * 1.5, 0.05);
            }

            // Soft warm ignition chime for Diya
            playDiyaLit() {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const freqs = [528, 660, 792, 1056];
                freqs.forEach((f, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, now + idx * 0.05);
                    gain.gain.setValueAtTime(0.06, now + idx * 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.05 + 0.9);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.05);
                    osc.stop(now + idx * 0.05 + 0.95);
                });
            }

            // Sacred Temple Bell Resonance for Big Pooja Diya
            playPoojaBell() {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const partials = [
                    { freq: 528, amp: 0.16, dur: 3.2 },
                    { freq: 1056, amp: 0.09, dur: 2.4 },
                    { freq: 1584, amp: 0.05, dur: 1.8 },
                    { freq: 2217, amp: 0.03, dur: 1.1 }
                ];
                partials.forEach(p => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(p.freq, now);
                    gain.gain.setValueAtTime(p.amp, now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + p.dur);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + p.dur + 0.05);
                });
            }

            // Anaar Fountain Roar
            playAnaarRoar(duration = 3.6) {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const src = this.ctx.createBufferSource();
                src.buffer = this.noiseBuffer;
                src.loop = true;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1100, now);
                filter.frequency.linearRampToValueAtTime(2200, now + duration * 0.5);
                filter.frequency.linearRampToValueAtTime(800, now + duration);
                filter.Q.setValueAtTime(1.4, now);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.22, now + 0.3);
                gain.gain.setValueAtTime(0.22, now + duration - 0.5);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                src.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                src.start(now);
                src.stop(now + duration);
            }

            // Upgraded Chakri Sound: Rhythmic rapid fizzy-whoosh pulsing (like real spinning gunpowder coil)
            playChakriSpin(duration = 3.6) {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;

                const src = this.ctx.createBufferSource();
                src.buffer = this.noiseBuffer;
                src.loop = true;

                // Bandpass filter sweeping up as spin accelerates
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(900, now);
                filter.frequency.exponentialRampToValueAtTime(2400, now + duration * 0.6);
                filter.frequency.exponentialRampToValueAtTime(1100, now + duration);
                filter.Q.setValueAtTime(3.2, now);

                // LFO to modulate volume at spinning rotation speed (whir-whir-whir)
                const lfo = this.ctx.createOscillator();
                lfo.type = 'sine';
                lfo.frequency.setValueAtTime(8, now);
                lfo.frequency.linearRampToValueAtTime(22, now + duration * 0.7);
                lfo.frequency.linearRampToValueAtTime(10, now + duration);

                const lfoDepth = this.ctx.createGain();
                lfoDepth.gain.setValueAtTime(0.06, now);

                const masterGain = this.ctx.createGain();
                masterGain.gain.setValueAtTime(0.09, now);
                masterGain.gain.linearRampToValueAtTime(0.15, now + 0.3);
                masterGain.gain.setValueAtTime(0.14, now + duration - 0.5);
                masterGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                lfo.connect(lfoDepth);
                lfoDepth.connect(masterGain.gain);

                src.connect(filter);
                filter.connect(masterGain);
                masterGain.connect(this.ctx.destination);

                src.start(now);
                lfo.start(now);
                src.stop(now + duration);
                lfo.stop(now + duration);
            }

            // Real Diwali rocket: ignition "pfffft", then a rough, crackling motor burn that
            // thins out with distance as the rocket climbs; length matches the real flight time.
            playRocketLaunch(duration = 1.6) {
                if (this.muted || !this.ctx) return;
                const t = this.ctx.currentTime;
                const D = Math.max(0.7, duration);
                const burn = D * 0.94;

                // 1. Ignition puff
                const puff = this.noiseAt(t, 0.2);
                const pf = this.ctx.createBiquadFilter();
                pf.type = 'bandpass';
                pf.frequency.value = 2200;
                pf.Q.value = 0.8;
                const pg = this.ctx.createGain();
                pg.gain.setValueAtTime(0.0001, t);
                pg.gain.linearRampToValueAtTime(0.32, t + 0.02);
                pg.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
                puff.connect(pf); pf.connect(pg);
                this.route(pg, 0.1);

                // 2. Motor burn: rough hiss that rises slightly in pitch and fades with distance
                const motor = this.ctx.createBufferSource();
                motor.buffer = this.noiseBuffer;
                motor.loop = true;
                const mf = this.ctx.createBiquadFilter();
                mf.type = 'bandpass';
                mf.frequency.setValueAtTime(1500, t);
                mf.frequency.exponentialRampToValueAtTime(2700, t + burn);
                mf.Q.value = 0.7;

                const rattle = this.ctx.createGain();
                rattle.gain.value = 0.68;
                const lfo = this.ctx.createOscillator();
                lfo.type = 'sawtooth';
                lfo.frequency.setValueAtTime(36, t);
                lfo.frequency.linearRampToValueAtTime(64, t + burn);
                const lfoDepth = this.ctx.createGain();
                lfoDepth.gain.value = 0.32;
                lfo.connect(lfoDepth);
                lfoDepth.connect(rattle.gain);

                const mg = this.ctx.createGain();
                mg.gain.setValueAtTime(0.0001, t);
                mg.gain.linearRampToValueAtTime(0.34, t + 0.07);
                mg.gain.linearRampToValueAtTime(0.2, t + burn * 0.55);
                mg.gain.linearRampToValueAtTime(0.07, t + burn);
                mg.gain.exponentialRampToValueAtTime(0.0001, t + D);

                motor.connect(mf); mf.connect(rattle); rattle.connect(mg);
                this.route(mg, 0.15);
                motor.start(t); lfo.start(t);
                motor.stop(t + D + 0.05); lfo.stop(t + D + 0.05);

                // 3. Low roar of the propellant
                const roar = this.ctx.createBufferSource();
                roar.buffer = this.noiseBuffer;
                roar.loop = true;
                const rf = this.ctx.createBiquadFilter();
                rf.type = 'lowpass';
                rf.frequency.setValueAtTime(900, t);
                rf.frequency.exponentialRampToValueAtTime(300, t + burn);
                const rg = this.ctx.createGain();
                rg.gain.setValueAtTime(0.0001, t);
                rg.gain.linearRampToValueAtTime(0.26, t + 0.08);
                rg.gain.exponentialRampToValueAtTime(0.03, t + burn);
                rg.gain.exponentialRampToValueAtTime(0.0001, t + D);
                roar.connect(rf); rf.connect(rg);
                this.route(rg, 0.1);
                roar.start(t); roar.stop(t + D + 0.05);

                // 4. Faint thin whistle on the stick
                const w = this.ctx.createOscillator();
                const wg = this.ctx.createGain();
                w.type = 'triangle';
                w.frequency.setValueAtTime(1250, t);
                w.frequency.exponentialRampToValueAtTime(2100, t + burn);
                wg.gain.setValueAtTime(0.0001, t);
                wg.gain.linearRampToValueAtTime(0.011, t + 0.15);
                wg.gain.exponentialRampToValueAtTime(0.0001, t + burn);
                w.connect(wg);
                this.route(wg, 0.05);
                w.start(t); w.stop(t + D);
            }

            // Sizzling "Chit-Chit-Chit" Crackling Star Cluster Sound after Sky Bursts
            playChitChitCluster(count = 16, spreadDuration = 0.9) {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;

                for (let i = 0; i < count; i++) {
                    const delay = (Math.pow(Math.random(), 1.3)) * spreadDuration;
                    const t = now + delay;

                    const src = this.ctx.createBufferSource();
                    src.buffer = this.noiseBuffer;

                    const hp = this.ctx.createBiquadFilter();
                    hp.type = 'bandpass';
                    hp.frequency.setValueAtTime(2600 + Math.random() * 2400, t);
                    hp.Q.setValueAtTime(4.5, t);

                    const g = this.ctx.createGain();
                    const amp = 0.08 + Math.random() * 0.1;
                    g.gain.setValueAtTime(amp, t);
                    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.032);

                    src.connect(hp);
                    hp.connect(g);
                    g.connect(this.ctx.destination);

                    src.start(t, Math.random() * 1.2, 0.035);
                }
            }

            // Deep Mortar Tube Launch Thump (for 12, 30, 60 Multi-Shot Sky Repeaters)
            playTubeThump() {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(38, now + 0.16);

                gain.gain.setValueAtTime(0.32, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.19);
            }

            // Authentic "Phat-Phat-Phat" Staccato Garland Lad Cracker Sound (100 / 1K / 5K / 10K Wala)
            playLadCrackerPop(intensity = 0.8) {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;

                // 1. Sharp, dry gunpowder paper whip-crack (high-pressure transient)
                const noiseSrc = this.ctx.createBufferSource();
                noiseSrc.buffer = this.noiseBuffer;

                const bandpass = this.ctx.createBiquadFilter();
                bandpass.type = 'bandpass';
                bandpass.frequency.setValueAtTime(1650 + Math.random() * 1900, now);
                bandpass.Q.setValueAtTime(0.85, now);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.55 * intensity, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);

                noiseSrc.connect(bandpass);
                bandpass.connect(gain);
                gain.connect(this.ctx.destination);

                noiseSrc.start(now, Math.random() * 1.4, 0.06);

                // 2. Crisp street-echo slap & mid-bass punch
                const punch = this.ctx.createOscillator();
                const punchGain = this.ctx.createGain();
                punch.type = 'sine';
                punch.frequency.setValueAtTime(260 + Math.random() * 90, now);
                punch.frequency.exponentialRampToValueAtTime(48, now + 0.05);

                punchGain.gain.setValueAtTime(0.42 * intensity, now);
                punchGain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);

                punch.connect(punchGain);
                punchGain.connect(this.ctx.destination);
                punch.start(now);
                punch.stop(now + 0.06);
            }

            // Heavy Sutli Bomb / Sky Burst Explosion
            playExplosion(intensity = 1.0) {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;

                // 1. Sub-bass chest punch
                const subOsc = this.ctx.createOscillator();
                const subGain = this.ctx.createGain();
                subOsc.type = 'sine';
                subOsc.frequency.setValueAtTime(135 * intensity, now);
                subOsc.frequency.exponentialRampToValueAtTime(24, now + 0.45);

                subGain.gain.setValueAtTime(0.65 * intensity, now);
                subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

                subOsc.connect(subGain);
                subGain.connect(this.ctx.destination);
                subOsc.start(now);
                subOsc.stop(now + 0.52);

                // 2. Broadband crack + reverb tail
                const noiseSrc = this.ctx.createBufferSource();
                noiseSrc.buffer = this.noiseBuffer;

                const lowpass = this.ctx.createBiquadFilter();
                lowpass.type = 'lowpass';
                lowpass.frequency.setValueAtTime(2600, now);
                lowpass.frequency.exponentialRampToValueAtTime(160, now + 0.9 * intensity);

                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.55 * intensity, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.95 * intensity);

                noiseSrc.connect(lowpass);
                lowpass.connect(noiseGain);
                noiseGain.connect(this.ctx.destination);

                noiseSrc.start(now);
                noiseSrc.stop(now + 1.0 * intensity);
            }
        }

        const audio = new DiwaliSoundEngine();

        /**
         * ============================================================================
         * 2. CANVAS, SCENE & PURE DIWALI PALETTE SETUP
         * ============================================================================
         */
        const canvas = document.getElementById('diwaliCanvas');
        const ctx = canvas.getContext('2d');

        let width = window.innerWidth;
        let height = window.innerHeight;
        let floorY = height * 0.58;

        // Traditional Festive Colors (Haldi Gold, Marigold, Kumkum Red, Copper, Warm Ivory)
        const DIWALI_COLORS = [
            '#FFD700', // Haldi Gold
            '#FF9933', // Kesari Saffron
            '#FF5E00', // Deep Marigold
            '#FFF3B0', // White-Hot Spark
            '#E63946', // Kumkum Crimson
            '#FFB703', // Warm Amber
            '#10B981', // Panna Emerald
            '#38BDF8', // Neelam Sapphire
            '#F43F5E', // Gulabi Rose
            '#A855F7'  // Jamuni Royal Violet
        ];

        let activeTool = 'sparkler';
        let appMode = 'courtyard'; // 'courtyard' | 'pooja'
        let pointer = { x: width / 2, y: height / 2, vx: 0, vy: 0, active: true };
        let screenFlash = 0;
        let screenFlashColor = '255, 195, 70';

        // Big Sacred Pooja Diya State (Smooth Real-Time Fluid Flame Physics)
        const poojaDiya = {

        const items = [];

        let layoutDirty = false; // becomes true once the user interacts, so we stop auto re-aligning

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                r = Math.min(Array.isArray(r) ? r[0] : (r || 0), w / 2, h / 2);
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
            };

        function setFlashColor(hex) {
            if (typeof hex !== 'string' || hex[0] !== '#' || hex.length !== 7) return;
            const n = parseInt(hex.slice(1), 16);
            screenFlashColor = `${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}`;
        }

        // Real flight time (seconds) of a shell, simulated with the same physics as AerialShell
        function estimateFlightSeconds(y, vy, targetY) {
            let frames = 0;
            while (frames < 600) {
                y += vy; vy += 0.08; frames++;
                if (y <= targetY || vy >= -1.5) break;
            }
            return frames / 60;
        }

        function getDockTop() {
            const el = document.getElementById('dockScroll');
            if (appMode === 'pooja' || !el) return height;
            const r = el.getBoundingClientRect();

        function resizeCanvas() {
            const oldW = width || window.innerWidth;
            const oldH = height || window.innerHeight;
            width = window.innerWidth;
            height = window.innerHeight;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            floorY = height * 0.56;

            // Keep existing courtyard items proportionally anchored when screen rotates or resizes
            if (items.length > 0 && oldW > 0 && oldH > 0) {
                const scaleX = width / oldW;
                const scaleY = height / oldH;
                for (const item of items) {
                    item.x = Math.max(28, Math.min(width - 28, item.x * scaleX));
                    item.y = Math.max(floorY + 18, Math.min(height - 112, item.y * scaleY));
                }
            }
        }
        function onResize() {
            resizeCanvas();
            if (!layoutDirty && typeof populateDefaultCourtyard === 'function' && items.length) populateDefaultCourtyard();
            if (typeof updateDockFade === 'function') updateDockFade();
        }
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', () => setTimeout(onResize, 250));
        resizeCanvas();

        /**
         * ============================================================================
         * 3. PARTICLE, SHOCKWAVE & AERIAL SHELL PHYSICS
         * ============================================================================
         */
        class Spark {
            constructor(x, y, vx, vy, color, size, decay, gravity = 0.15, drag = 0.985, opts = null) {
                this.x = x;
                this.y = y;
                this.prevX = x;
                this.prevY = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.size = size;
                this.alpha = 1;
                this.decay = decay;
                this.gravity = gravity;
                this.drag = drag;
                // Optional attributes for "chit-chit" crackling stars, strobing glitters, and red paper confetti
                this.crackle = opts?.crackle || false;
                this.strobe = opts?.strobe || false;
                this.isPaper = opts?.isPaper || false;
                this.hasCrackled = false;
                this.cross = opts?.cross || 0;      // crossette: splits into 4 stars
                this.crossed = false;
                this.tail = opts?.tail || false;    // comet: leaves a trail of embers
                this.age = 0;
            }

            update() {
                this.prevX = this.x;
                this.prevY = this.y;
                this.vx *= this.drag;
                this.vy *= this.drag;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;

                // Bounce sparks off the courtyard floor if they hit near the bottom
                if (this.gravity > 0.08 && this.y > height - 85 && this.vy > 0) {
                    this.vy *= -0.45;
                    this.vx *= 0.75;
                }

                if (this.cross && !this.crossed && this.alpha < this.cross) {
                    this.crossed = true;
                    const base = Math.atan2(this.vy, this.vx) + Math.PI / 4;
                    for (let k = 0; k < 4; k++) {
                        const a = base + k * Math.PI / 2;
                        const sp = 2.4 + Math.random() * 0.8;
                        sparks.push(new Spark(this.x, this.y, Math.cos(a) * sp, Math.sin(a) * sp, '#FFFBEB', 2.1, 0.032, 0.05, 0.95));
                    }
                }
                if (this.tail && (++this.age % 2 === 0)) {
                    sparks.push(new Spark(this.x, this.y, (Math.random() - 0.5) * 0.4, Math.random() * 0.4, this.color, 1.6, 0.05, 0.02, 0.9));
                }

                // "Chit-Chit" Secondary Star Crackle Pop at end of trail!
                if (this.crackle && !this.hasCrackled && this.alpha < 0.36) {
                    this.hasCrackled = true;
                    for (let i = 0; i < 5; i++) {
                        const a = Math.random() * Math.PI * 2;
                        const s = 1.6 + Math.random() * 3.8;
                        sparks.push(new Spark(
                            this.x,
                            this.y,
                            Math.cos(a) * s,
                            Math.sin(a) * s,
                            i % 2 === 0 ? '#FFFBEB' : this.color,
                            1.7,
                            0.065,
                            0.05,
                            0.94
                        ));
                    }
                }
            }

            draw(ctx) {
                if (this.alpha <= 0) return;
                if (this.strobe && Math.random() < 0.32) return; // Twinkling glitter effect

                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);

                // Red Paper Confetti Debris for 100/1K/5K/10K Wala Lads
                if (this.isPaper) {
                    ctx.fillStyle = this.color;
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.vx * 0.5 + this.alpha * 6);
                    ctx.fillRect(-this.size, -this.size * 0.5, this.size * 2, this.size);
                    ctx.restore();
                    return;
                }

                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.size;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(this.prevX, this.prevY);
                ctx.lineTo(this.x, this.y);
                ctx.stroke();

                // Hot core
                ctx.fillStyle = '#FFFBEB';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 0.45, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Shockwave {
            constructor(x, y, maxRadius, color) {
                this.x = x;
                this.y = y;
                this.radius = 6;
                this.maxRadius = maxRadius;
                this.color = color;
                this.alpha = 1;
            }

            update() {
                this.radius += (this.maxRadius - this.radius) * 0.16;
                this.alpha -= 0.04;
            }

            draw(ctx) {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3.5 * this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        // Dedicated Aerial Shell Projectile (Used by Rockets & 12/30/60 Multi-Shot Cakes)
        // Features 6 distinct Diwali sky burst patterns + sizzling "Chit-Chit" crackling stars!
        const SKY_BURST_TYPES = [
            'navratna_crackle', // Multi-color Navratna jewel burst with "chit-chit" crackling tips
            'heart',            // Glowing red heart with a golden heart inside
            'satrangi_rings',   // Concentric double-ring Satrangi wave + silver strobing core
            'crossette',        // Stars that split into four crossing sparks
            'golden_willow',    // Long weeping golden brocade willow trails + crackling tips
            'ganga_jamuna',     // Saffron and green split burst
            'kundan_palm',      // Thick rising golden palm fronds + emerald/ruby pistils
            'double_break',     // Big burst followed by a second ring burst
            'diwali_chakra',    // Spiral galaxy pinwheel burst in the sky
            'saturn_ring',      // Ball of stars wrapped in a tilted ring
            'spider_comets',    // Long-tailed comets
            'silver_glitter',   // White strobing glitter with crackle
            'chit_chit_storm'   // Pure crackling star cluster with rapid "chit-chit" pops
        ];

        class AerialShell {
            constructor(x, y, vx, vy, targetY, shellSize = 1.0, burstType = null) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.targetY = targetY;
                this.shellSize = shellSize;
                this.wobbleSeed = Math.random() * 100;
                this.wobbleAmp = (Math.random() - 0.5) * 0.32;
                this.done = false;
                this.burstType = burstType || SKY_BURST_TYPES[Math.floor(Math.random() * SKY_BURST_TYPES.length)];
                this.color = DIWALI_COLORS[Math.floor(Math.random() * DIWALI_COLORS.length)];
                this.secondaryColor = DIWALI_COLORS[Math.floor(Math.random() * DIWALI_COLORS.length)];
            }

            update() {
                this.wobbleSeed += 0.25;
                // Natural aerodynamic flight curve
                this.vx += Math.sin(this.wobbleSeed) * this.wobbleAmp * 0.14;
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.08;

                // Bright golden rocket propellant tail
                for (let i = 0; i < 4; i++) {
                    sparks.push(new Spark(
                        this.x + (Math.random() - 0.5) * 3,
                        this.y + 6,
                        -this.vx * 0.22 + (Math.random() - 0.5) * 1.5,
                        2.2 + Math.random() * 3.2,
                        Math.random() > 0.3 ? '#FFD700' : '#FF5E00',
                        2.2,
                        0.048,
                        0.05
                    ));
                }

                // Detonate at target apex
                if (this.y <= this.targetY || this.vy >= -1.5) {
                    this.detonate();
                    this.done = true;
                }
            }

            detonate() {
                audio.playBurstBoom(0.95 * this.shellSize);
                setFlashColor(this.color);
                screenFlash = Math.min(0.82, screenFlash + 0.36 * this.shellSize);
                shockwaves.push(new Shockwave(this.x, this.y, 175 * this.shellSize, this.color));
                shockwaves.push(new Shockwave(this.x, this.y, 110 * this.shellSize, '#FFF3B0'));

                const s = this.shellSize;

                // PATTERN 1: Navratna Multi-Color Crackle Peony ("Chit-Chit" finale)
                if (this.burstType === 'navratna_crackle') {
                    const count = Math.floor(95 * s);
                    for (let i = 0; i < count; i++) {
                        const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.08;
                        const spd = (3.8 + Math.random() * 8.8) * s;
                        const col = DIWALI_COLORS[i % DIWALI_COLORS.length];
                        sparks.push(new Spark(
                            this.x, this.y,
                            Math.cos(ang) * spd, Math.sin(ang) * spd,
                            col, 2.5, 0.014 + Math.random() * 0.01, 0.09, 0.975,
                            { crackle: i % 3 === 0, strobe: i % 2 === 0 }
                        ));
                    }
                    setTimeout(() => audio.playChitChitCluster(18, 0.75), 240);
                }

                // PATTERN 2: Satrangi Concentric Double Rings + Strobe Core
                else if (this.burstType === 'satrangi_rings') {
                    const outerCount = Math.floor(54 * s);
                    for (let i = 0; i < outerCount; i++) {
                        const ang = (Math.PI * 2 * i) / outerCount;
                        const spd = 9.2 * s;
                        sparks.push(new Spark(
                            this.x, this.y,
                            Math.cos(ang) * spd, Math.sin(ang) * spd,
                            this.color, 2.6, 0.015, 0.07, 0.972,
                            { strobe: true }
                        ));
                    }
                    const innerCount = Math.floor(36 * s);
                    for (let i = 0; i < innerCount; i++) {
                        const ang = (Math.PI * 2 * i) / innerCount + 0.08;
                        const spd = 5.4 * s;
                        sparks.push(new Spark(
                            this.x, this.y,
                            Math.cos(ang) * spd, Math.sin(ang) * spd,
                            this.secondaryColor, 2.3, 0.016, 0.07, 0.972,
                            { crackle: i % 2 === 0 }
                        ));
                    }
                    setTimeout(() => audio.playChitChitCluster(14, 0.65), 280);
                }

                // PATTERN 3: Royal Golden Brocade Willow (Long weeping trails)
                else if (this.burstType === 'golden_willow') {
                    const count = Math.floor(80 * s);
                    for (let i = 0; i < count; i++) {
                        const ang = Math.random() * Math.PI * 2;
                        const spd = (2.5 + Math.random() * 8.2) * s;
                        const col = i % 4 === 0 ? '#FFF3B0' : (i % 2 === 0 ? '#FFD700' : '#FF9933');
                        sparks.push(new Spark(
                            this.x, this.y,
                            Math.cos(ang) * spd, Math.sin(ang) * spd,
                            col, 2.4, 0.008 + Math.random() * 0.006, 0.14, 0.982,
                            { crackle: i % 5 === 0 }
                        ));
                    }
                    setTimeout(() => audio.playChitChitCluster(12, 0.85), 350);
                }

                // PATTERN 4: Kundan Palm Burst (Thick golden fronds + jewel pistils)
                else if (this.burstType === 'kundan_palm') {
                    const branches = 10;
                    for (let b = 0; b < branches; b++) {
                        const baseAng = (Math.PI * 2 * b) / branches + (Math.random() - 0.5) * 0.15;
                        for (let k = 1; k <= 8; k++) {
                            const spd = (k * 1.25) * s;
                            sparks.push(new Spark(
                                this.x, this.y,
                                Math.cos(baseAng) * spd + (Math.random() - 0.5) * 0.5,
                                Math.sin(baseAng) * spd + (Math.random() - 0.5) * 0.5,
                                k > 6 ? this.color : '#FFD700',
                                3.0 - k * 0.15,
                                0.013,
                                0.11,
                                0.976,
                                { crackle: k === 8 }
                            ));
                        }
                    }
                    setTimeout(() => audio.playChitChitCluster(14, 0.6), 260);
                }

                // PATTERN 5: Diwali Sky Chakra (Spiral Pinwheel Galaxy)
                else if (this.burstType === 'diwali_chakra') {
                    const arms = 6;
                    const perArm = Math.floor(16 * s);
                    for (let a = 0; a < arms; a++) {
                        const armColor = DIWALI_COLORS[(a * 2) % DIWALI_COLORS.length];
                        for (let j = 0; j < perArm; j++) {
                            const frac = j / perArm;
                            const ang = (Math.PI * 2 * a) / arms + frac * 1.6;
                            const spd = (2.5 + frac * 8.5) * s;
                            sparks.push(new Spark(
                                this.x, this.y,
                                Math.cos(ang) * spd, Math.sin(ang) * spd,
                                armColor, 2.4, 0.014, 0.08, 0.975,
                                { strobe: j % 2 === 0, crackle: j === perArm - 1 }
                            ));
                        }
                    }
                    setTimeout(() => audio.playChitChitCluster(15, 0.7), 250);
                }

                // NEW: Heart
                else if (this.burstType === 'heart') {
                    for (let layer = 0; layer < 2; layer++) {
                        const k = (layer === 0 ? 0.46 : 0.25) * s;
                        const col = layer === 0 ? '#F43F5E' : '#FFD700';
                        const n = Math.floor((layer === 0 ? 68 : 40) * s);
                        for (let i = 0; i < n; i++) {
                            const t = (i / n) * Math.PI * 2;
                            const hx = 16 * Math.pow(Math.sin(t), 3);
                            const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                            sparks.push(new Spark(this.x, this.y, hx * k, hy * k, col, 2.7, 0.016, 0.012, 0.965, { strobe: layer === 1, crackle: i % 9 === 0 }));
                        }
                    }
                    setTimeout(() => audio.playChitChitCluster(10, 0.6), 300);
                }

                // NEW: Ganga-Jamuna (saffron + green halves)
                else if (this.burstType === 'ganga_jamuna') {
                    const n = Math.floor(104 * s);
                    for (let i = 0; i < n; i++) {
                        const ang = (Math.PI * 2 * i) / n;
                        const spd = (4.8 + Math.random() * 4.6) * s;
                        const col = i < n / 2 ? '#FF9933' : '#10B981';
                        sparks.push(new Spark(this.x, this.y, Math.cos(ang) * spd, Math.sin(ang) * spd, col, 2.6, 0.015, 0.07, 0.972, { strobe: i % 3 === 0, crackle: i % 8 === 0 }));
                    }
                    setTimeout(() => audio.playChitChitCluster(12, 0.7), 280);
                }

                // NEW: Crossette (each star splits into 4)
                else if (this.burstType === 'crossette') {
                    const n = Math.floor(18 * s);
                    for (let i = 0; i < n; i++) {
                        const ang = (Math.PI * 2 * i) / n + (Math.random() - 0.5) * 0.1;
                        const spd = (6 + Math.random() * 2.2) * s;
                        sparks.push(new Spark(this.x, this.y, Math.cos(ang) * spd, Math.sin(ang) * spd, i % 2 ? '#FFD700' : this.color, 3.0, 0.012, 0.06, 0.975, { cross: 0.5 }));
                    }
                    setTimeout(() => audio.playChitChitCluster(22, 0.7), 520);
                }

                // NEW: Double break (second burst a moment later)
                else if (this.burstType === 'double_break') {
                    const bx = this.x, by = this.y, col2 = this.secondaryColor;
                    const n = Math.floor(70 * s);
                    for (let i = 0; i < n; i++) {
                        const ang = (Math.PI * 2 * i) / n;
                        const spd = (3 + Math.random() * 6) * s;
                        sparks.push(new Spark(bx, by, Math.cos(ang) * spd, Math.sin(ang) * spd, this.color, 2.6, 0.015, 0.08, 0.974, { strobe: i % 2 === 0 }));
                    }
                    setTimeout(() => {
                        audio.playBurstBoom(0.65 * s);
                        setFlashColor(col2);
                        screenFlash = Math.min(0.8, screenFlash + 0.25);
                        shockwaves.push(new Shockwave(bx, by, 120 * s, col2));
                        for (let i = 0; i < 60; i++) {
                            const ang = (Math.PI * 2 * i) / 60;
                            sparks.push(new Spark(bx, by, Math.cos(ang) * 7.5 * s, Math.sin(ang) * 7.5 * s, col2, 2.5, 0.016, 0.07, 0.972, { crackle: i % 4 === 0 }));
                        }
                        for (let i = 0; i < 30; i++) {
                            const ang = Math.random() * Math.PI * 2;
                            const spd = (1.5 + Math.random() * 3.5) * s;
                            sparks.push(new Spark(bx, by, Math.cos(ang) * spd, Math.sin(ang) * spd, '#FFF3B0', 2.2, 0.018, 0.06, 0.972, { strobe: true }));
                        }
                        audio.playChitChitCluster(12, 0.6);
                    }, 380);
                }

                // NEW: Saturn (ball of stars + tilted ring)
                else if (this.burstType === 'saturn_ring') {
                    for (let i = 0; i < 34; i++) {
                        const ang = Math.random() * Math.PI * 2;
                        const spd = (1.5 + Math.random() * 4) * s;
                        sparks.push(new Spark(this.x, this.y, Math.cos(ang) * spd, Math.sin(ang) * spd, this.color, 2.5, 0.015, 0.05, 0.97));
                    }
                    const tilt = -0.45, ct = Math.cos(tilt), st = Math.sin(tilt);
                    for (let i = 0; i < 60; i++) {
                        const th = (Math.PI * 2 * i) / 60;
                        const vx = Math.cos(th) * 9.5 * s, vy = Math.sin(th) * 9.5 * s * 0.26;
                        sparks.push(new Spark(this.x, this.y, vx * ct - vy * st, vx * st + vy * ct, this.secondaryColor, 2.7, 0.014, 0.035, 0.972, { strobe: i % 2 === 0 }));
                    }
                    setTimeout(() => audio.playChitChitCluster(10, 0.6), 300);
                }

                // NEW: Spider comets (long-tailed streakers)
                else if (this.burstType === 'spider_comets') {
                    const n = Math.floor(13 * s);
                    for (let i = 0; i < n; i++) {
                        const ang = (Math.PI * 2 * i) / n + (Math.random() - 0.5) * 0.25;
                        const spd = (5 + Math.random() * 3.5) * s;
                        sparks.push(new Spark(this.x, this.y, Math.cos(ang) * spd, Math.sin(ang) * spd, i % 2 ? '#FFF3B0' : '#FFD700', 3.4, 0.0105, 0.1, 0.982, { tail: true, crackle: true }));
                    }
                    setTimeout(() => audio.playChitChitCluster(14, 0.8), 700);
                }

                // NEW: Silver glitter (ice-white strobe)
                else if (this.burstType === 'silver_glitter') {
                    const n = Math.floor(110 * s);
                    const cols = ['#E0F2FE', '#FFFFFF', '#BAE6FD'];
                    for (let i = 0; i < n; i++) {
                        const ang = Math.random() * Math.PI * 2;
                        const spd = (2 + Math.random() * 7.5) * s;
                        sparks.push(new Spark(this.x, this.y, Math.cos(ang) * spd, Math.sin(ang) * spd, cols[i % 3], 2.3, 0.011, 0.05, 0.975, { strobe: true, crackle: i % 2 === 0 }));
                    }
                    setTimeout(() => audio.playChitChitCluster(30, 1.2), 250);
                }

                // PATTERN 6: Chit-Chit Crackling Crossette Storm
                else {
                    const count = Math.floor(72 * s);
                    for (let i = 0; i < count; i++) {
                        const ang = Math.random() * Math.PI * 2;
                        const spd = (3.5 + Math.random() * 7.8) * s;
                        const col = DIWALI_COLORS[Math.floor(Math.random() * DIWALI_COLORS.length)];
                        sparks.push(new Spark(
                            this.x, this.y,
                            Math.cos(ang) * spd, Math.sin(ang) * spd,
                            col, 2.7, 0.018 + Math.random() * 0.01, 0.08, 0.97,
                            { crackle: true, strobe: true }
                        ));
                    }
                    setTimeout(() => audio.playChitChitCluster(26, 0.95), 180);
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.fillStyle = '#FFFBEB';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        /**
         * ============================================================================
         * 4. TRADITIONAL DIWALI ITEMS (Diya, Chakri, Anaar, Sutli, Rocket,
         *    100/1000/5000/10000 Wala Lads, and 12/30/60 Multi-Shot Sky Cakes)
         * ============================================================================
         */
        // Lads: 100 & 1000 are straight hanging threads, 5000 & 10000 are big coiled rolls
        const WALA_SPECS = {
            wala100:   { kind: 'thread', len: 58,  pairs: 12, cw: 9,   ch: 3.6, per: 1,  pops: 100,  frames: 300, weight: 0.30, tier: 1 },
            wala1000:  { kind: 'thread', len: 150, pairs: 46, cw: 6,   ch: 2.4, per: 5,  pops: 1000, frames: 600, weight: 0.20, tier: 2 },
            wala5000:  { kind: 'roll',   r: 34, turns: 4,   cw: 6,   per: 9,  pops: 2160, frames: 720, weight: 0.50, tier: 3 },
            wala10000: { kind: 'roll',   r: 44, turns: 5.5, cw: 7.5, per: 13, pops: 3640, frames: 840, weight: 0.75, tier: 4 }
        };

        class DiwaliItem {
            constructor(type, x, y, free = false) {
                this.type = type;
                this.x = x;
                this.y = free ? y : Math.max(floorY + 20, Math.min(height - 112, y));
                this.threadLen = WALA_SPECS[type] && WALA_SPECS[type].kind === 'thread'
                    ? Math.max(40, Math.min(WALA_SPECS[type].len, this.y - 76)) : 0;
                this.popAcc = 0;
                this.muzzleGlow = 0;
                this.finishTimer = 50;
                this.shotTotal = 0;
                this.typeOffset = 0;
                this.state = 'unlit'; // 'unlit' -> 'fuse' -> 'active' -> 'done'
                this.fuseProgress = 0;
                this.fuseSpeed = type === 'diya' ? 0.09 : 0.018;
                this.activeTimer = 0;
                this.maxTimer = 1;
                this.spinAngle = 0;
                this.flameFlicker = Math.random() * 100;

                // Rocket & Multi-Shot properties
                this.tiltAngle = (Math.random() - 0.5) * 0.28; // Natural launch slant
                this.shotsRemaining = 0;
                this.shotCooldown = 0;
                this.shotInterval = 18;
            }

            isWala() {
                return this.type.startsWith('wala');
            }

            isMultiShot() {
                return this.type.startsWith('shot');
            }

            // Returns world coordinates of the current fuse tip
            getFuseTip() {
                const p = this.fuseProgress;
                switch (this.type) {
                    case 'diya':
                        return { x: this.x + 18, y: this.y - 8 };
                    case 'chakri': {
                        const angle = -0.6 + p * 0.6;
                        const dist = 34 * (1 - p) + 18 * p;
                        return {
                            x: this.x + Math.cos(angle) * dist,
                            y: this.y + Math.sin(angle) * (dist * 0.55)
                        };
                    }
                    case 'anaar':
                        return {
                            x: this.x + Math.sin((1 - p) * 3) * 5,
                            y: this.y - 42 - (1 - p) * 16
                        };
                    case 'sutli':
                        return {
                            x: this.x + (1 - p) * 14,
                            y: this.y - 24 - (1 - p) * 18
                        };
                    case 'rocket':
                        return {
                            x: this.x - 10 * (1 - p),
                            y: this.y + 8 + (1 - p) * 14
                        };
                    case 'wala100':
                    case 'wala1000':
                        // thread is lit at its bottom end and burns upward
                        return { x: this.x + (1 - p) * 9, y: this.y + 4 + (1 - p) * 14 };
                    case 'wala5000':
                    case 'wala10000': {
                        const R = WALA_SPECS[this.type].r;
                        return { x: this.x + R + (1 - p) * 16, y: this.y + (1 - p) * 4 };
                    }
                    case 'shot12':
                    case 'shot30':
                    case 'shot60': {
                        const halfW = this.type === 'shot12' ? 20 : (this.type === 'shot30' ? 28 : 36);
                        return {
                            x: this.x - halfW - (1 - p) * 12,
                            y: this.y - 22 - (1 - p) * 10
                        };
                    }
                }
                return { x: this.x, y: this.y };
            }

            igniteFuse() {
                if (this.state !== 'unlit') return;
                audio.init();
                this.state = 'fuse';
                layoutDirty = true;
                if (this.type === 'sutli' || this.type === 'rocket' || this.isWala() || this.isMultiShot()) {
                    audio.playFuseHiss(1 / this.fuseSpeed / 60, 0.05);
                }

                // Initial ignition spark burst
                const tip = this.getFuseTip();
                for (let i = 0; i < 12; i++) {
                    const ang = Math.random() * Math.PI * 2;
                    const spd = 1 + Math.random() * 4;
                    sparks.push(new Spark(tip.x, tip.y, Math.cos(ang) * spd, Math.sin(ang) * spd, '#FFD700', 2, 0.05));
                }
            }

            triggerMainAction() {
                this.state = 'active';

                if (this.type === 'diya') {
                    audio.playDiyaLit();
                } else if (this.type === 'chakri') {
                    this.activeTimer = 215;
                    audio.playChakriSpin(3.6);
                } else if (this.type === 'anaar') {
                    this.activeTimer = 220;
                    audio.playAnaarRoar(3.6);
                } else if (this.type === 'sutli') {
                    audio.playSutliBomb(1.25);
                    screenFlashColor = '255, 190, 80';
                    screenFlash = 0.85;
                    this.triggerScreenShake();
                    for (let i = 0; i < 16; i++) {
                        const ang = -Math.PI * (0.1 + Math.random() * 0.8);
                        const spd = 3 + Math.random() * 9;
                        sparks.push(new Spark(this.x, this.y - 10, Math.cos(ang) * spd, Math.sin(ang) * spd, i % 3 ? '#15803D' : '#DC2626', 2.6, 0.02, 0.26, 0.95, { isPaper: true }));
                    }

                    shockwaves.push(new Shockwave(this.x, this.y - 10, 260, '#FFD700'));
                    shockwaves.push(new Shockwave(this.x, this.y - 10, 170, '#FF4500'));

                    for (let i = 0; i < 140; i++) {
                        const ang = Math.random() * Math.PI * 2;
                        const spd = 2 + Math.random() * 16;
                        const col = DIWALI_COLORS[Math.floor(Math.random() * DIWALI_COLORS.length)];
                        sparks.push(new Spark(
                            this.x,
                            this.y - 10,
                            Math.cos(ang) * spd,
                            Math.sin(ang) * spd - 2,
                            col,
                            1.8 + Math.random() * 2.5,
                            0.014 + Math.random() * 0.02,
                            0.18
                        ));
                    }
                    this.state = 'done';
                } else if (this.type === 'rocket') {
                    // Launch an AerialShell with realistic varied angle, speed, and burst altitude
                    const speed = 12.0 + Math.random() * 3.5;
                    const launchVx = Math.sin(this.tiltAngle) * speed + (Math.random() - 0.5) * 2.0;
                    const launchVy = -Math.cos(this.tiltAngle) * speed;
                    const targetY = height * (0.10 + Math.random() * 0.24);
                    const flightDuration = estimateFlightSeconds(this.y - 20, launchVy, targetY);

                    audio.playRocketLaunch(flightDuration);
                    aerialShells.push(new AerialShell(this.x, this.y - 20, launchVx, launchVy, targetY, 1.15));
                    this.state = 'done';
                } else if (this.isWala()) {
                    const spec = WALA_SPECS[this.type];
                    this.maxTimer = spec.frames;
                    this.activeTimer = spec.frames;
                    this.popAcc = 0;
                    audio.playCrackerTrain(spec.pops, spec.frames / 60, spec.weight, spec.kind, spec.per);
                } else if (this.isMultiShot()) {
                    // Sky Shot Repeaters: 12, 30, 60 Shots
                    const counts = { shot12: 12, shot30: 30, shot60: 60 };
                    const intervals = { shot12: 26, shot30: 15, shot60: 14 };
                    this.shotTotal = counts[this.type] || 12;
                    this.shotsRemaining = this.shotTotal;
                    this.shotInterval = intervals[this.type] || 18;
                    this.shotCooldown = 2;
                    this.finishTimer = 50;
                    this.typeOffset = Math.floor(Math.random() * SKY_BURST_TYPES.length);
                }
            }

            fireShotVolley() {
                const idx = this.shotTotal - this.shotsRemaining;
                const boxW = this.type === 'shot12' ? 30 : (this.type === 'shot30' ? 44 : 58);
                const finale = this.type === 'shot60' && this.shotsRemaining <= 6;
                let salvo = this.type === 'shot60' ? (finale ? this.shotsRemaining : 3) : 1;
                salvo = Math.min(salvo, this.shotsRemaining);

                audio.playTubeThump();
                for (let k = 0; k < salvo; k++) {
                    const frac = salvo > 1 ? k / (salvo - 1) : 0.5;
                    let vx;
                    let tubeFrac;
                    if (this.type === 'shot12') {
                        vx = ((idx % 3) - 1) * 1.1 + (Math.random() - 0.5) * 0.6;   // tight vertical volleys
                        tubeFrac = (idx * 0.618) % 1;
                    } else if (this.type === 'shot30') {
                        const ph = (idx % 10) / 9;
                        const dir = Math.floor(idx / 10) % 2 === 0 ? ph : 1 - ph;    // left-right-left fan sweeps
                        vx = (dir - 0.5) * 7;
                        tubeFrac = dir;
                    } else {
                        vx = (frac - 0.5) * (finale ? 9.5 : 6.5) + (Math.random() - 0.5) * 0.8; // salvos of three, finale of six
                        tubeFrac = frac;
                    }
                    const tubeX = this.x + (tubeFrac - 0.5) * boxW;
                    const tubeY = this.y - 24;

                    for (let i = 0; i < 8; i++) {
                        const ang = -Math.PI / 2 + (Math.random() - 0.5) * 0.6;
                        const spd = 2 + Math.random() * 5;
                        sparks.push(new Spark(tubeX, tubeY, Math.cos(ang) * spd, Math.sin(ang) * spd, '#FFD700', 1.8, 0.06, 0.1));
                    }

                    const launchVy = -(11.5 + Math.random() * 3.5) - (finale ? 1 : 0);
                    const targetY = height * (0.08 + Math.random() * 0.28);
                    const size = finale ? 1.1 : (this.type === 'shot12' ? 1.0 : (this.type === 'shot30' ? 0.9 : 0.8));
                    const burst = SKY_BURST_TYPES[(this.typeOffset + idx + k) % SKY_BURST_TYPES.length];
                    aerialShells.push(new AerialShell(tubeX, tubeY, vx, launchVy, targetY, size, burst));
                }
                this.shotsRemaining -= salvo;
                this.muzzleGlow = 1;
                screenFlashColor = '255, 195, 70';
                screenFlash = Math.min(0.4, screenFlash + 0.07);
            }

            triggerScreenShake() {
                document.body.classList.remove('shake');
                void document.body.offsetWidth;
                document.body.classList.add('shake');
            }

            update() {
                this.flameFlicker += 0.18;
                if (this.muzzleGlow > 0) this.muzzleGlow *= 0.86;

                // 1. Burning thread fuse state
                if (this.state === 'fuse') {
                    this.fuseProgress += this.fuseSpeed;
                    const tip = this.getFuseTip();

                    for (let i = 0; i < 3; i++) {
                        const ang = Math.random() * Math.PI * 2;
                        const spd = 0.8 + Math.random() * 3.2;
                        sparks.push(new Spark(
                            tip.x,
                            tip.y,
                            Math.cos(ang) * spd,
                            Math.sin(ang) * spd - 0.8,
                            Math.random() > 0.35 ? '#FFD700' : '#FF5E00',
                            1.6,
                            0.06,
                            0.1
                        ));
                    }
                    if (Math.random() < 0.45) audio.playSparkPop(3400, 0.03);

                    if (this.fuseProgress >= 1) {
                        this.fuseProgress = 1;
                        this.triggerMainAction();
                    }
                }

                // 2. Active state per cracker type
                if (this.state === 'active') {
                    if (this.type === 'diya') {
                        if (Math.random() < 0.08) {
                            sparks.push(new Spark(
                                this.x + 18 + (Math.random() - 0.5) * 3,
                                this.y - 18,
                                (Math.random() - 0.5) * 0.4,
                                -0.8 - Math.random() * 0.8,
                                '#FFD700',
                                1.5,
                                0.03,
                                -0.02
                            ));
                        }
                    } else if (this.type === 'chakri') {
                        this.activeTimer--;
                        this.spinAngle += 0.48;
                        this.x += Math.cos(this.spinAngle * 0.17) * 1.4;
                        this.y += Math.sin(this.spinAngle * 0.13) * 0.6;
                        this.x = Math.max(24, Math.min(width - 24, this.x));
                        this.y = Math.max(floorY + 10, Math.min(height - 108, this.y));

                        for (let i = 0; i < 7; i++) {
                            const tangAngle = this.spinAngle + (i * Math.PI * 0.5) + (Math.random() - 0.5) * 0.3;
                            const spd = 4 + Math.random() * 7;
                            const col = i % 2 === 0 ? '#FFD700' : '#FF6B00';
                            sparks.push(new Spark(
                                this.x + Math.cos(tangAngle) * 14,
                                this.y + Math.sin(tangAngle) * 8,
                                Math.cos(tangAngle) * spd,
                                Math.sin(tangAngle) * spd * 0.65,
                                col,
                                2.1,
                                0.032,
                                0.05
                            ));
                        }
                        if (Math.random() < 0.35) audio.playSparkPop(2600, 0.025);
                        if (this.activeTimer <= 0) this.state = 'done';

                    } else if (this.type === 'anaar') {
                        this.activeTimer--;
                        for (let i = 0; i < 9; i++) {
                            const spread = (Math.random() - 0.5) * 0.48;
                            const angle = -Math.PI / 2 + spread;
                            const spd = 7 + Math.random() * 9.5;
                            const col = Math.random() > 0.3 ? '#FFD700' : (Math.random() > 0.5 ? '#FFFBEB' : '#FF7B00');
                            sparks.push(new Spark(
                                this.x,
                                this.y - 40,
                                Math.cos(angle) * spd,
                                Math.sin(angle) * spd,
                                col,
                                2.2 + Math.random() * 1.5,
                                0.016 + Math.random() * 0.012,
                                0.24
                            ));
                        }
                        if (Math.random() < 0.5) audio.playSparkPop(2200, 0.03);
                        if (this.activeTimer <= 0) this.state = 'done';

                    } else if (this.isWala()) {
                        const spec = WALA_SPECS[this.type];
                        const tier = spec.tier;
                        this.activeTimer--;
                        const prog = Math.min(1, 1 - this.activeTimer / this.maxTimer);

                        // Burning head: threads burn bottom -> top, rolls burn outside -> inside along the spiral
                        let bx, by;
                        if (spec.kind === 'thread') {
                            bx = this.x + (Math.random() - 0.5) * 8;
                            by = this.y - prog * this.threadLen;
                        } else {
                            const th = prog * spec.turns * Math.PI * 2;
                            const rr = spec.r - (spec.r - spec.r * 0.2) * prog;
                            bx = this.x + Math.cos(th) * rr;
                            by = this.y + Math.sin(th) * rr * 0.58;
                        }
                        this.lastBlastX = bx;
                        this.lastBlastY = by;

                        // one cracker beat every 3 frames (0.05 s)
                        const elapsed = this.maxTimer - this.activeTimer;
                        let ev = (elapsed % 3 === 1) ? Math.min(spec.per, spec.kind === 'thread' ? 2 : 4) : 0;

                        for (let e = 0; e < ev; e++) {
                            const jx = bx + (Math.random() - 0.5) * (spec.kind === 'thread' ? 10 : 14);
                            const jy = by + (Math.random() - 0.5) * (spec.kind === 'thread' ? 8 : 6);
                            screenFlashColor = '255, 195, 70';
                            screenFlash = Math.min(0.5, screenFlash + 0.02 + 0.013 * tier);

                            const n = 5 + tier * 2;
